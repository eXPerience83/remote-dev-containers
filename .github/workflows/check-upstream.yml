name: Check upstream versions

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # This workflow intentionally retains checkout credentials because it maintains
      # the dedicated automation branch with the repository-scoped GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: upstream maintenance may only run from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Check stable upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source versions.env

          curl_args=(
            --fail
            --silent
            --show-error
            --location
            --retry 3
            --retry-all-errors
            --connect-timeout 10
            --max-time 300
          )

          latest_codex="$(gh api repos/openai/codex/releases/latest --jq .tag_name)"
          latest_gh="$(gh api repos/cli/cli/releases/latest --jq '.tag_name | ltrimstr("v")')"
          latest_ttyd="$(gh api repos/tsl0922/ttyd/releases/latest --jq .tag_name)"
          latest_mise="$(gh api repos/jdx/mise/releases/latest --jq '.tag_name | ltrimstr("v")')"
          latest_uv="$(gh api repos/astral-sh/uv/releases/latest --jq .tag_name)"

          python_line="${PYTHON_VERSION%.*}"
          python_pattern="${python_line//./[.]}"
          mapfile -t python_candidates < <(
            curl "${curl_args[@]}" https://www.python.org/ftp/python/ \
              | grep -oE "href=\"${python_pattern}\.[0-9]+/" \
              | sed -E 's/^href="//; s|/$||' \
              | sort -Vr
          )
          latest_python=""
          for candidate in "${python_candidates[@]}"; do
            if curl "${curl_args[@]}" --head \
              "https://www.python.org/ftp/python/${candidate}/Python-${candidate}.tar.xz" >/dev/null; then
              latest_python="$candidate"
              break
            fi
          done

          node_major="${NODE_VERSION%%.*}"
          latest_node="$(curl "${curl_args[@]}" https://nodejs.org/dist/index.json \
            | jq -r --arg prefix "v${node_major}." \
              '[.[] | select(.lts != false and (.version | startswith($prefix))) | .version | ltrimstr("v")]
               | sort_by(split(".") | map(tonumber))
               | last')"

          npm_major="${NPM_VERSION%%.*}"
          latest_npm="$(curl "${curl_args[@]}" https://registry.npmjs.org/npm \
            | jq -r --arg prefix "${npm_major}." \
              '.versions | keys[] | select(startswith($prefix)) | select(contains("-") | not)' \
            | sort -V \
            | tail -n 1)"

          if [[ ! "$latest_codex" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: GitHub latest release is not an exact stable Codex tag: $latest_codex" >&2
            exit 1
          fi
          if [[ ! "$latest_gh" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: GitHub CLI latest release has an unexpected tag: $latest_gh" >&2
            exit 1
          fi
          if [[ ! "$latest_ttyd" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: ttyd latest release has an unexpected tag: $latest_ttyd" >&2
            exit 1
          fi
          if [[ ! "$latest_mise" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: mise latest release has an unexpected tag: $latest_mise" >&2
            exit 1
          fi
          if [[ ! "$latest_python" =~ ^3\.14\.[0-9]+$ ]]; then
            echo "ERROR: Python latest maintenance release has an unexpected version: $latest_python" >&2
            exit 1
          fi
          if [[ ! "$latest_node" =~ ^24\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Node latest selected LTS release has an unexpected version: $latest_node" >&2
            exit 1
          fi
          if [[ ! "$latest_npm" =~ ^12\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: npm latest selected major release has an unexpected version: $latest_npm" >&2
            exit 1
          fi
          if [[ ! "$latest_uv" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: uv latest release has an unexpected tag: $latest_uv" >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          gh api "repos/openai/codex/releases/tags/${latest_codex}" > "$workdir/codex.json"
          gh api "repos/cli/cli/releases/tags/v${latest_gh}" > "$workdir/gh.json"
          gh api "repos/tsl0922/ttyd/releases/tags/${latest_ttyd}" > "$workdir/ttyd.json"
          gh api "repos/jdx/mise/releases/tags/v${latest_mise}" > "$workdir/mise.json"

          release_sha256() {
            local release_json="$1"
            local asset="$2"
            local digest=""
            local checksum_url=""

            digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // empty' "$release_json")"
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf '%s\n' "${digest#sha256:}"
              return 0
            fi

            checksum_url="$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .browser_download_url // empty' "$release_json")"
            if [[ -n "$checksum_url" ]]; then
              digest="$(curl "${curl_args[@]}" "$checksum_url" \
                | awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print $1; exit }')"
            fi

            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "ERROR: release asset $asset has no valid GitHub digest or SHA256SUMS entry: $digest" >&2
              exit 1
            fi
            printf '%s\n' "$digest"
          }

          codex_amd64_sha256="$(release_sha256 "$workdir/codex.json" codex-x86_64-unknown-linux-musl.tar.gz)"
          codex_arm64_sha256="$(release_sha256 "$workdir/codex.json" codex-aarch64-unknown-linux-musl.tar.gz)"
          codex_code_mode_host_amd64_sha256="$(release_sha256 "$workdir/codex.json" codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz)"
          codex_code_mode_host_arm64_sha256="$(release_sha256 "$workdir/codex.json" codex-code-mode-host-aarch64-unknown-linux-musl.tar.gz)"
          gh_amd64_sha256="$(release_sha256 "$workdir/gh.json" "gh_${latest_gh}_linux_amd64.tar.gz")"
          gh_arm64_sha256="$(release_sha256 "$workdir/gh.json" "gh_${latest_gh}_linux_arm64.tar.gz")"
          ttyd_amd64_sha256="$(release_sha256 "$workdir/ttyd.json" ttyd.x86_64)"
          ttyd_arm64_sha256="$(release_sha256 "$workdir/ttyd.json" ttyd.aarch64)"
          mise_amd64_sha256="$(release_sha256 "$workdir/mise.json" "mise-v${latest_mise}-linux-x64")"
          mise_arm64_sha256="$(release_sha256 "$workdir/mise.json" "mise-v${latest_mise}-linux-arm64")"

          branch="automation/update-upstreams"
          existing_pr="$(gh pr list \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          remote_ref="refs/remotes/origin/$branch"
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null
          remote_status=$?
          set -e
          case "$remote_status" in
            0)
              git fetch origin "refs/heads/$branch:$remote_ref"
              ;;
            2)
              ;;
            *)
              echo "ERROR: could not determine whether remote automation branch exists" >&2
              exit "$remote_status"
              ;;
          esac

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$branch"

          replace_env() {
            local name="$1"
            local value="$2"
            grep -q "^${name}=" versions.env \
              || { echo "ERROR: versions.env has no ${name} pin" >&2; exit 1; }
            sed -i "s|^${name}=.*|${name}=${value}|" versions.env
          }

          replace_arg() {
            local file="$1"
            local name="$2"
            local value="$3"
            grep -q "^ARG ${name}=" "$file" \
              || { echo "ERROR: $file has no ARG ${name} default" >&2; exit 1; }
            sed -i "s|^ARG ${name}=.*|ARG ${name}=${value}|" "$file"
          }

          replace_mise_tool() {
            local name="$1"
            local value="$2"
            grep -q "^${name} = \"" mise.toml \
              || { echo "ERROR: mise.toml has no ${name} tool pin" >&2; exit 1; }
            sed -i "s|^${name} = .*|${name} = \"${value}\"|" mise.toml
          }

          replace_env CODEX_RELEASE_TAG "$latest_codex"
          replace_env CODEX_AMD64_SHA256 "$codex_amd64_sha256"
          replace_env CODEX_ARM64_SHA256 "$codex_arm64_sha256"
          replace_env CODEX_CODE_MODE_HOST_AMD64_SHA256 "$codex_code_mode_host_amd64_sha256"
          replace_env CODEX_CODE_MODE_HOST_ARM64_SHA256 "$codex_code_mode_host_arm64_sha256"
          replace_env GH_VERSION "$latest_gh"
          replace_env GH_AMD64_SHA256 "$gh_amd64_sha256"
          replace_env GH_ARM64_SHA256 "$gh_arm64_sha256"
          replace_env TTYD_VERSION "$latest_ttyd"
          replace_env TTYD_AMD64_SHA256 "$ttyd_amd64_sha256"
          replace_env TTYD_ARM64_SHA256 "$ttyd_arm64_sha256"
          replace_env MISE_VERSION "$latest_mise"
          replace_env MISE_AMD64_SHA256 "$mise_amd64_sha256"
          replace_env MISE_ARM64_SHA256 "$mise_arm64_sha256"
          replace_env PYTHON_VERSION "$latest_python"
          replace_env NODE_VERSION "$latest_node"
          replace_env NPM_VERSION "$latest_npm"
          replace_env UV_VERSION "$latest_uv"

          replace_arg images/codex/Dockerfile CODEX_RELEASE_TAG "$latest_codex"
          replace_arg images/codex/Dockerfile CODEX_AMD64_SHA256 "$codex_amd64_sha256"
          replace_arg images/codex/Dockerfile CODEX_ARM64_SHA256 "$codex_arm64_sha256"
          replace_arg images/codex/Dockerfile CODEX_CODE_MODE_HOST_AMD64_SHA256 "$codex_code_mode_host_amd64_sha256"
          replace_arg images/codex/Dockerfile CODEX_CODE_MODE_HOST_ARM64_SHA256 "$codex_code_mode_host_arm64_sha256"
          replace_arg images/base/Dockerfile GH_VERSION "$latest_gh"
          replace_arg images/base/Dockerfile GH_AMD64_SHA256 "$gh_amd64_sha256"
          replace_arg images/base/Dockerfile GH_ARM64_SHA256 "$gh_arm64_sha256"
          replace_arg images/base/Dockerfile TTYD_VERSION "$latest_ttyd"
          replace_arg images/base/Dockerfile TTYD_AMD64_SHA256 "$ttyd_amd64_sha256"
          replace_arg images/base/Dockerfile TTYD_ARM64_SHA256 "$ttyd_arm64_sha256"
          replace_arg images/base/Dockerfile MISE_VERSION "$latest_mise"
          replace_arg images/base/Dockerfile MISE_AMD64_SHA256 "$mise_amd64_sha256"
          replace_arg images/base/Dockerfile MISE_ARM64_SHA256 "$mise_arm64_sha256"
          replace_arg images/base/Dockerfile PYTHON_VERSION "$latest_python"
          replace_arg images/base/Dockerfile NODE_VERSION "$latest_node"
          replace_arg images/base/Dockerfile NPM_VERSION "$latest_npm"
          replace_arg images/base/Dockerfile UV_VERSION "$latest_uv"

          replace_mise_tool python "$latest_python"
          replace_mise_tool node "$latest_node"
          replace_mise_tool uv "$latest_uv"

          mise_bin="$workdir/mise"
          curl "${curl_args[@]}" \
            "https://github.com/jdx/mise/releases/download/v${latest_mise}/mise-v${latest_mise}-linux-x64" \
            -o "$mise_bin"
          printf '%s  %s\n' "$mise_amd64_sha256" "$mise_bin" | sha256sum -c -
          chmod 0755 "$mise_bin"
          MISE_BIN="$mise_bin" bash scripts/regenerate-mise-lock.sh

          bash scripts/validate-version-pins.sh
          python3 scripts/update-third-party-inventory.py --write
          bash scripts/validate-third-party-inventory.sh
          python3 scripts/sync-standalone-artifact-inspection.py
          python3 scripts/validate-standalone-artifact-inspection.py

          tracked_files=(
            versions.env
            mise.toml
            mise.lock
            images/base/Dockerfile
            images/codex/Dockerfile
            third_party/inventory.json
            third_party/components
            third_party/standalone-artifact-inspection.json
            third_party/standalone-artifact-inspection.md
          )
          if git diff --quiet -- "${tracked_files[@]}"; then
            echo "No upstream release, digest, runtime artifact, inventory, notice or standalone-inspection changes."
            if [[ -n "$existing_pr" ]]; then
              gh pr close "$existing_pr" \
                --comment "Closing because main already contains the latest tracked stable releases, digests, locked runtime artifacts, legal notices and standalone inspection evidence."
            fi
            exit 0
          fi

          git add "${tracked_files[@]}"
          git commit -m "chore: update upstream versions, notices, digests, and runtime lock"

          if git rev-parse --verify "$remote_ref" >/dev/null 2>&1 &&
             [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse "$remote_ref^{tree}")" ]]; then
            echo "The automation branch already contains the desired update."
            git reset --hard "$remote_ref"
          else
            git push --force-with-lease -u origin "$branch"
          fi

          branch_head="$(git rev-parse HEAD)"
          existing_pr="$(gh pr list \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          body="Automated stable upstream release, digest, runtime-lock and legal-notice update. Tracks final Codex, GitHub CLI, ttyd, mise and uv releases plus maintenance updates within Python 3.14, Node 24 LTS and npm 12. The same PR regenerates exact AMD64 and ARM64 runtime artifacts, synchronizes the declarative legal inventory, refreshes repository-preserved notices from exact version tags and updates the bounded standalone-artifact inspection for changed GitHub CLI, Codex CLI, ttyd, mise or uv assets. Any changed legal text or asset-packaging evidence remains visible in the pull-request diff for human review. Merge only after the required AMD64 build, image vulnerability scans, runtime smoke tests and review pass. Build AMD64 is dispatched explicitly because pull-request runs created with GITHUB_TOKEN otherwise require manual approval. Merging publishes a new public edge image; stable image tags are not changed."

          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" \
              --title "chore: update stable upstream versions and runtime lock" \
              --body "$body"
          else
            gh pr create \
              --title "chore: update stable upstream versions and runtime lock" \
              --body "$body" \
              --base main \
              --head "$branch"
          fi

          # GitHub deliberately gates pull_request workflows created by GITHUB_TOKEN.
          # workflow_dispatch is an explicit exception, so dispatch the required build
          # against the exact automation branch without introducing a PAT or app secret.
          run_json="$(gh run list \
            --workflow build-amd64.yml \
            --branch "$branch" \
            --event workflow_dispatch \
            --commit "$branch_head" \
            --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0] // {}')"
          run_id="$(jq -r '.databaseId // empty' <<<"$run_json")"
          run_status="$(jq -r '.status // empty' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"

          if [[ -z "$run_id" ]]; then
            gh workflow run build-amd64.yml --ref "$branch"
          elif [[ "$run_status" == "completed" && "$run_conclusion" != "success" ]]; then
            echo "Previous Build AMD64 run $run_id completed with $run_conclusion; dispatching a retry."
            gh workflow run build-amd64.yml --ref "$branch"
          else
            echo "Build AMD64 run $run_id is already $run_status${run_conclusion:+/$run_conclusion} for $branch_head."
          fi
