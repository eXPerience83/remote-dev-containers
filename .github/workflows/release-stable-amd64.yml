name: Release Stable AMD64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact stable tag matching BASE_VERSION (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      release_sha:
        description: "Full reviewed current main SHA"
        required: true
        type: string
      accepted_edge_digest:
        description: "Owner-accepted Edge runtime OCI index digest (sha256:...)"
        required: true
        type: string
      dry_run:
        description: "Read-only validation; do not create tags, images or releases"
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-stable-amd64
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_SHA: ${{ inputs.release_sha }}
  ACCEPTED_EDGE_DIGEST: ${{ inputs.accepted_edge_digest }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      publication_authorized: ${{ steps.publication_boundary.outputs.authorized }}
    steps:
      - name: Require trusted manual dispatch
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_ACTOR_ID" == 16572400 && "$GITHUB_RUN_ATTEMPT" == 1 ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate owner, current source, required CI and accepted Edge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stable-release-policy.py

      - name: Validate repository configuration
        run: |
          bash scripts/validate-publication-source.sh stable

      - name: Permit validation-only while finalization is incomplete
        id: publication_boundary
        # Temporary fail-closed boundary until tag authorization and Release
        # finalization are implemented and reviewed in this same draft.
        run: |
          set -euo pipefail
          [[ "$DRY_RUN" == true ]] || {
            echo "ERROR: Stable publication finalization is not enabled" >&2
            exit 1
          }
          echo "authorized=false" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    if: inputs.dry_run == false && needs.validate.outputs.publication_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Recheck exact owner authorization before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stable-release-policy.py

      - name: Prepare isolated SPDX validator before registry login
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/remote-dev-spdx-validator"
          "$RUNNER_TEMP/remote-dev-spdx-validator/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/spdx-validator-requirements.lock.txt

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase GHCR namespace
        id: registry
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Load versions
        id: versions
        run: |
          source versions.env
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ubuntu_version=$UBUNTU_VERSION" >> "$GITHUB_OUTPUT"
          echo "ubuntu_digest=$UBUNTU_DIGEST" >> "$GITHUB_OUTPUT"
          echo "codex_tag=$CODEX_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "codex_amd64_sha256=$CODEX_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "codex_arm64_sha256=$CODEX_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_version=$GH_VERSION" >> "$GITHUB_OUTPUT"
          echo "gh_amd64_sha256=$GH_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_arm64_sha256=$GH_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_version=$TTYD_VERSION" >> "$GITHUB_OUTPUT"
          echo "ttyd_amd64_sha256=$TTYD_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_arm64_sha256=$TTYD_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_version=$MISE_VERSION" >> "$GITHUB_OUTPUT"
          echo "mise_amd64_sha256=$MISE_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_arm64_sha256=$MISE_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "python_315_version=$PYTHON_315_VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "uv_version=$UV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build untagged stable base candidate
        id: base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ steps.registry.outputs.namespace }}/remote-dev-base,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            UBUNTU_VERSION=${{ steps.versions.outputs.ubuntu_version }}
            UBUNTU_DIGEST=${{ steps.versions.outputs.ubuntu_digest }}
            BASE_VERSION=${{ steps.versions.outputs.base_version }}
            GH_VERSION=${{ steps.versions.outputs.gh_version }}
            GH_AMD64_SHA256=${{ steps.versions.outputs.gh_amd64_sha256 }}
            GH_ARM64_SHA256=${{ steps.versions.outputs.gh_arm64_sha256 }}
            TTYD_VERSION=${{ steps.versions.outputs.ttyd_version }}
            TTYD_AMD64_SHA256=${{ steps.versions.outputs.ttyd_amd64_sha256 }}
            TTYD_ARM64_SHA256=${{ steps.versions.outputs.ttyd_arm64_sha256 }}
            MISE_VERSION=${{ steps.versions.outputs.mise_version }}
            MISE_AMD64_SHA256=${{ steps.versions.outputs.mise_amd64_sha256 }}
            MISE_ARM64_SHA256=${{ steps.versions.outputs.mise_arm64_sha256 }}
            PYTHON_VERSION=${{ steps.versions.outputs.python_version }}
            PYTHON_315_VERSION=${{ steps.versions.outputs.python_315_version }}
            NODE_VERSION=${{ steps.versions.outputs.node_version }}
            NPM_VERSION=${{ steps.versions.outputs.npm_version }}
            UV_VERSION=${{ steps.versions.outputs.uv_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            io.github.experience83.remote-dev.channel=stable
          provenance: mode=max
          sbom: true

      - name: Resolve exact stable base AMD64 manifest
        id: base_manifest
        env:
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$(bash scripts/resolve-oci-platform-manifest.sh \
            "ghcr.io/${NAMESPACE}/remote-dev-base@${BASE_DIGEST}" linux amd64 --wait-for-push)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Build untagged stable Remote Dev candidate
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: images/codex/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ steps.registry.outputs.namespace }}/remote-dev,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ steps.base_manifest.outputs.ref }}
            CODEX_RELEASE_TAG=${{ steps.versions.outputs.codex_tag }}
            CODEX_AMD64_SHA256=${{ steps.versions.outputs.codex_amd64_sha256 }}
            CODEX_ARM64_SHA256=${{ steps.versions.outputs.codex_arm64_sha256 }}
            PROJECT_VERSION=${{ inputs.release_tag }}
            PROJECT_CHANNEL=stable
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            io.github.experience83.remote-dev.channel=stable
          provenance: mode=max
          sbom: true

      - name: Resolve exact stable Remote Dev AMD64 manifest
        id: runtime_manifest
        env:
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
          REMOTE_DEV_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$(bash scripts/resolve-oci-platform-manifest.sh \
            "ghcr.io/${NAMESPACE}/remote-dev@${REMOTE_DEV_DIGEST}" linux amd64 --wait-for-push)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact stable publication candidates
        env:
          REMOTE_DEV_TEST_EXCHANGE: "1"
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          BASE_MANIFEST_REF: ${{ steps.base_manifest.outputs.ref }}
          REMOTE_DEV_DIGEST: ${{ steps.runtime.outputs.digest }}
          REMOTE_DEV_MANIFEST_REF: ${{ steps.runtime_manifest.outputs.ref }}
          PROJECT_VERSION: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          bash scripts/validate-edge-publication-candidate.sh \
            "ghcr.io/${NAMESPACE}/remote-dev-base@${BASE_DIGEST}" \
            "$BASE_MANIFEST_REF" \
            "ghcr.io/${NAMESPACE}/remote-dev@${REMOTE_DEV_DIGEST}" \
            "$REMOTE_DEV_MANIFEST_REF" \
            "$GITHUB_SHA" \
            "$PROJECT_VERSION"

      - name: Generate exact stable base SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.base_manifest.outputs.ref }}
          format: spdx-json
          output: sbom-publish-base.spdx.json

      - name: Generate exact stable Remote Dev SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime_manifest.outputs.ref }}
          format: spdx-json
          output: sbom-publish-remote-dev.spdx.json
          skip-setup-trivy: true
          cache: false

      # Trivy omits Chromium Headless Shell when provisioned from a raw ZIP.
      # Supplement SPDX with image-derived archive/binary/license evidence.
      # This is provenance only, not a Chromium CVE scan.
      - name: Record exact Chromium identity and notices in stable SPDX images
        env:
          BASE_MANIFEST_REF: ${{ steps.base_manifest.outputs.ref }}
          REMOTE_DEV_MANIFEST_REF: ${{ steps.runtime_manifest.outputs.ref }}
        run: |
          set -euo pipefail
          python3 scripts/chromium-sbom-evidence.py \
            --image "$BASE_MANIFEST_REF" \
            --spdx sbom-publish-base.spdx.json \
            --evidence chromium-evidence-publish-base.json
          python3 scripts/chromium-sbom-evidence.py \
            --image "$REMOTE_DEV_MANIFEST_REF" \
            --spdx sbom-publish-remote-dev.spdx.json \
            --evidence chromium-evidence-publish-remote-dev.json

      # A structural self-check is not a substitute for SPDX 2.3 semantics.
      # Enforce independent parsing of both final, Chromium-augmented documents.
      - name: Validate exact stable SPDX documents with independent parser
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/remote-dev-spdx-validator/bin/pyspdxtools" -i sbom-publish-base.spdx.json
          "$RUNNER_TEMP/remote-dev-spdx-validator/bin/pyspdxtools" -i sbom-publish-remote-dev.spdx.json

      - name: Scan exact stable base candidate for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.base_manifest.outputs.ref }}
          format: json
          output: trivy-publish-base.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"
          skip-setup-trivy: true
          cache: false

      - name: Scan exact stable Remote Dev candidate for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime_manifest.outputs.ref }}
          format: json
          output: trivy-publish-remote-dev.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"
          skip-setup-trivy: true
          cache: false

      - name: Upload exact stable publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-publication-reports
          path: |
            sbom-publish-base.spdx.json
            sbom-publish-remote-dev.spdx.json
            chromium-evidence-publish-base.json
            chromium-evidence-publish-remote-dev.json
            trivy-publish-base.json
            trivy-publish-remote-dev.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce no fixable critical vulnerabilities
        env:
          BASE_MANIFEST_REF: ${{ steps.base_manifest.outputs.ref }}
          REMOTE_DEV_MANIFEST_REF: ${{ steps.runtime_manifest.outputs.ref }}
          UBUNTU_VERSION: ${{ steps.versions.outputs.ubuntu_version }}
        run: |
          set -euo pipefail
          python3 scripts/validate-trivy-image-report.py trivy-publish-base.json \
            --expect-image "$BASE_MANIFEST_REF" --expect-ubuntu "$UBUNTU_VERSION"
          python3 scripts/validate-trivy-image-report.py trivy-publish-remote-dev.json \
            --expect-image "$REMOTE_DEV_MANIFEST_REF" --expect-ubuntu "$UBUNTU_VERSION"

      - name: Guard stable promotion against overwrite or downgrade
        id: promotion_guard
        env:
          BASE_MANIFEST_INDEX: ${{ steps.base.outputs.digest }}
          REMOTE_DEV_MANIFEST_INDEX: ${{ steps.runtime.outputs.digest }}
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
        run: |
          set -euo pipefail
          python3 scripts/guard-stable-promotion.py \
            --tag "$RELEASE_TAG" \
            --base "ghcr.io/${NAMESPACE}/remote-dev-base@${BASE_MANIFEST_INDEX}" \
            --runtime "ghcr.io/${NAMESPACE}/remote-dev@${REMOTE_DEV_MANIFEST_INDEX}" \
            --journal stable-promotion-preflight.json

      - name: Promote one scanned digest to canonical stable tags
        if: steps.promotion_guard.outputs.mode == 'fresh'
        env:
          NAMESPACE: ${{ steps.registry.outputs.namespace }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          REMOTE_DEV_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          bash scripts/promote-publication-indexes.sh stable \
            "ghcr.io/${NAMESPACE}/remote-dev-base@${BASE_DIGEST}" \
            "ghcr.io/${NAMESPACE}/remote-dev@${REMOTE_DEV_DIGEST}" "$RELEASE_TAG"

      - name: Upload stable promotion preflight and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stable-promotion-journal
          path: |
            stable-promotion-preflight.json
            base-promotion.json
            runtime-promotion.json
          if-no-files-found: ignore
          retention-days: 14
