name: Temporary Playwright updater discovery acceptance
on:
  pull_request:
    paths:
      - .github/workflows/playwright-upstream-acceptance.yml
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise real read-only discovery and cross-check output schema
        env:
          ARCH: ${{ matrix.arch }}
          REPORT: ${{ runner.temp }}/playwright-${{ matrix.arch }}.json
        run: |
          set -euo pipefail
          python3 scripts/test_playwright_upstream.py
          python3 scripts/playwright-upstream.py discover --arch "$ARCH" --output "$REPORT"
          jq -er --arg arch "$ARCH" '.schema_version == 1 and .arch == $arch and
            (.status == "unchanged" or .status == "candidate" or .status == "deferred")' \
            "$REPORT" >/dev/null
          jq '{status,arch,baseline_version,version,reason,playwright_core_version,
               archive_digests: (.archives // {} | with_entries(.value |= {revision,sha256,url}))}' "$REPORT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-discovery-acceptance-${{ matrix.arch }}
          path: ${{ runner.temp }}/playwright-${{ matrix.arch }}.json
          retention-days: 2
          if-no-files-found: error

  reconcile:
    name: revalidate both real candidate artifacts without write permissions
    needs: discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-discovery-acceptance-amd64
          path: ${{ runner.temp }}/playwright-candidates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-discovery-acceptance-arm64
          path: ${{ runner.temp }}/playwright-candidates
      - name: Verify exactly one coherent group without writing to repository
        env:
          AMD64: ${{ runner.temp }}/playwright-candidates/playwright-amd64.json
          ARM64: ${{ runner.temp }}/playwright-candidates/playwright-arm64.json
        run: |
          set -euo pipefail
          python3 scripts/playwright-upstream.py reconcile \
            --amd64 "$AMD64" --arm64 "$ARM64"
          python3 scripts/test_playwright_upstream.py

          # Simulate exactly the writer-side source update on a separate
          # scratch checkout. The repository remains read-only in this job.
          stage="$RUNNER_TEMP/playwright-update-acceptance"
          mkdir -p "$stage/images/base" "$stage/config"
          cp versions.env "$stage/versions.env"
          cp images/base/Dockerfile "$stage/images/base/Dockerfile"
          cp config/playwright-package*.json "$stage/config/"
          cp config/playwright-browser-archives.json "$stage/config/"
          cp -a third_party "$stage/third_party"
          python3 - "$stage" "$AMD64" "$ARM64" <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys

          spec = importlib.util.spec_from_file_location(
              "playwright_upstream_acceptance",
              Path("scripts/playwright-upstream.py").resolve())
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          root = Path(sys.argv[1])
          amd64 = json.loads(Path(sys.argv[2]).read_text())
          arm64 = json.loads(Path(sys.argv[3]).read_text())
          result = module.reconcile(root, amd64, arm64, write=True)
          assert result == "updated", result
          assert module.baseline_version(root) == amd64["version"]
          PY
          python3 scripts/update-third-party-inventory.py \
            --write --root "$stage"
          python3 scripts/update-third-party-inventory.py \
            --check --root "$stage"
          python3 - "$stage" <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location(
              "lock_validator",
              Path("scripts/validate-playwright-lock.py").resolve())
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.check_repo(root)
          inventory = json.loads((root / "third_party/inventory.json").read_text())
          version = module.checked_version((root / "versions.env").read_text())
          component = next(x for x in inventory["components"] if x["id"] == "playwright-mcp")
          assert component["version"] == version
          assert (root / "third_party/components/playwright-mcp/LICENSE").is_file()
          print("PASS: coherent package, browser, legal inventory and license source")
          PY
          git diff --exit-code
