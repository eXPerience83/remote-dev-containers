name: Test optional Antigravity runtime

on:
  pull_request:
    paths:
      - ".github/workflows/test-antigravity-runtime.yml"
      - "scripts/remote-dev-antigravity.sh"
      - "scripts/remote-dev-install-antigravity.sh"
      - "scripts/remote-dev-update-antigravity.sh"
      - "scripts/run-antigravity.sh"
      - "scripts/secure-persistent-state.sh"
      - "scripts/test-antigravity-runtime.sh"
      - "scripts/test-antigravity-security-regressions.sh"
      - "scripts/test-antigravity-staging-wrappers.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-antigravity-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Offline runtime regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate scripts
        run: |
          bash -n \
            scripts/remote-dev-antigravity.sh \
            scripts/remote-dev-install-antigravity.sh \
            scripts/remote-dev-update-antigravity.sh \
            scripts/run-antigravity.sh \
            scripts/secure-persistent-state.sh \
            scripts/test-antigravity-runtime.sh \
            scripts/test-antigravity-security-regressions.sh \
            scripts/test-antigravity-staging-wrappers.sh

      - name: Run controlled fixture lifecycle
        run: |
          chmod 0755 \
            scripts/remote-dev-antigravity.sh \
            scripts/run-antigravity.sh
          bash scripts/test-antigravity-runtime.sh
          bash scripts/test-antigravity-security-regressions.sh
          bash scripts/test-antigravity-staging-wrappers.sh
