name: Request reviewed PR candidate AMD64

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/publish-candidate ') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: none
    permissions:
      actions: write
      pull-requests: read

    steps:
      - name: Resolve and authorize the pull request
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          requested_sha="${COMMAND_BODY#'/publish-candidate '}"
          if [[ ! "$requested_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: usage: /publish-candidate <full-40-character-head-sha>" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$COMMENT_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: invalid PR/comment identity" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"

          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "ERROR: candidate publication is limited to branches in $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$base_ref" != main ]]; then
            echo "ERROR: candidate pull request must target main; got $base_ref" >&2
            exit 1
          fi
          if [[ "$state" != open ]]; then
            echo "ERROR: candidate pull request must be open; got $state" >&2
            exit 1
          fi
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid pull-request head revision: $head_sha" >&2
            exit 1
          fi
          if [[ "$requested_sha" != "$head_sha" ]]; then
            echo "ERROR: authorized SHA $requested_sha is no longer the PR head $head_sha" >&2
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Dispatch trusted candidate worker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          COMMENT_ID: ${{ steps.candidate.outputs.comment_id }}
        run: |
          set -euo pipefail
          payload="$(
            jq -n \
              --arg ref main \
              --arg pr_number "$PR_NUMBER" \
              --arg head_sha "$HEAD_SHA" \
              --arg comment_id "$COMMENT_ID" \
              '{
                ref: $ref,
                inputs: {
                  pr_number: $pr_number,
                  head_sha: $head_sha,
                  authorization_comment_id: $comment_id
                }
              }'
          )"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-pr-candidate-worker-amd64.yml/dispatches" \
            --input - <<<"$payload"
