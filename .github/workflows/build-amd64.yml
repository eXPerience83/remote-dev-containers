name: Build AMD64

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve mise asset digests for pinning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=2026.5.3
          release="$(gh api "repos/jdx/mise/releases/tags/v${version}")"
          for asset in \
            "mise-v${version}-linux-x64" \
            "mise-v${version}-linux-arm64"; do
            digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' <<<"$release")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "ERROR: missing digest for $asset: $digest" >&2
              exit 1
            fi
            echo "PIN $asset ${digest#sha256:}"
          done
          exit 1
