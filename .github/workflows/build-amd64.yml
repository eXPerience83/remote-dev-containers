name: Build AMD64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate scripts and Compose files
        run: |
          bash -n scripts/*.sh
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - name: Build and smoke test
        run: PLATFORM=linux/amd64 ./scripts/build-local.sh
