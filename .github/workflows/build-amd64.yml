name: Build AMD64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Validate repository configuration
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          python3 -m py_compile \
            scripts/update-third-party-inventory.py \
            scripts/test_update_third_party_inventory.py \
            scripts/sync-python-runtime-notices.py
          python3 scripts/test_update_third_party_inventory.py
          python3 scripts/update-third-party-inventory.py --check
          python3 scripts/sync-python-runtime-notices.py --check
          bash scripts/validate-version-pins.sh
          bash scripts/validate-third-party-inventory.sh
          bash scripts/test-source-revision.sh
          jq -e . renovate.json >/dev/null
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - name: Build and smoke test
        run: PLATFORM=linux/amd64 ./scripts/build-local.sh

      - name: Verify bundled notices
        run: |
          docker run --rm --entrypoint remote-dev-notices \
            codex-remote-dev-base:local --check
          docker run --rm --entrypoint remote-dev-notices \
            codex-remote-dev:local --check

      - name: Generate base image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codex-remote-dev-base:local
          format: spdx-json
          output: sbom-base.spdx.json

      - name: Generate Codex image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codex-remote-dev:local
          format: spdx-json
          output: sbom-codex.spdx.json

      - name: Scan base image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codex-remote-dev-base:local
          format: json
          output: trivy-base.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"

      - name: Scan Codex image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codex-remote-dev:local
          format: json
          output: trivy-codex.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"

      - name: Upload security and SBOM reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-and-sbom-reports
          path: |
            sbom-base.spdx.json
            sbom-codex.spdx.json
            trivy-base.json
            trivy-codex.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce no fixable critical vulnerabilities
        run: |
          bash scripts/enforce-trivy-gate.sh \
            "base image:trivy-base.json" \
            "Codex image:trivy-codex.json"
