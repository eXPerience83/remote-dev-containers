name: Build AMD64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate repository configuration
        run: |
          bash -n scripts/*.sh
          bash scripts/validate-version-pins.sh
          jq -e . renovate.json >/dev/null
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - name: Build and smoke test
        run: |
          set -euo pipefail
          log_file="/tmp/remote-dev-build.log"
          failure_tail="/tmp/build-failure-tail.log"
          if ! PLATFORM=linux/amd64 ./scripts/build-local.sh >"$log_file" 2>&1; then
            echo "Build or smoke test failed. Final log lines:" >&2
            tail -n 160 "$log_file" | tee "$failure_tail" >&2
            exit 1
          fi
          tail -n 80 "$log_file"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-tail
          path: /tmp/build-failure-tail.log
          if-no-files-found: ignore
          retention-days: 1
