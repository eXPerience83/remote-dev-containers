name: Build AMD64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Validate repository configuration
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          python3 -m py_compile \
            scripts/remote-dev-launcher.py \
            scripts/remote-dev-codex-runtime.py \
            scripts/remote-dev-prepare-development-scratch.py \
            scripts/test-development-scratch.py \
            scripts/test-remote-dev-codex-runtime.py \
            scripts/test-codex-runtime-code-mode-probe.py \
            scripts/test-codex-runtime-noexec-staging.py \
            scripts/remote-dev-context7.py \
            scripts/test-remote-dev-context7.py \
            scripts/test-remote-dev-context7-ownership.py \
            scripts/preflight-data-layout.py \
            scripts/inspect-antigravity-cli.py \
            scripts/test_single_stack_compose.py \
            scripts/test_canonical_data_layout.py \
            scripts/test_preflight_data_layout.py \
            scripts/test_inspect_antigravity_cli.py \
            scripts/update-third-party-inventory.py \
            scripts/test_update_third_party_inventory.py \
            scripts/sync-python-runtime-notices.py \
            scripts/test_sync_python_runtime_notices.py \
            scripts/compact-python-runtime-notices.py \
            scripts/test_compact_python_runtime_notices.py \
            scripts/sync-standalone-artifact-inspection.py \
            scripts/test_sync_standalone_artifact_inspection.py \
            scripts/validate-standalone-artifact-inspection.py \
            scripts/test_validate_standalone_artifact_inspection.py \
            scripts/validate-release-channel-contract.py \
            scripts/validate-renovate-ownership.py \
            scripts/test_validate_renovate_ownership.py \
            scripts/render-vulnerability-rescan-alert.py \
            scripts/test_render_vulnerability_rescan_alert.py \
            scripts/test_resolve_published_image_digest.py \
            scripts/test_periodic_image_rescan_workflow.py \
            scripts/test_publish_edge_security_cadence.py \
            web/ttyd-osc52/generate.py \
            web/ttyd-osc52/validate.py \
            web/ttyd-osc52/test_generate.py
          python3 web/ttyd-osc52/validate.py
          python3 web/ttyd-osc52/generate.py --check
          node web/ttyd-osc52/test_osc52.js
          python3 web/ttyd-osc52/test_generate.py
          make agent-contract-tests
          python3 scripts/test-remote-dev-codex-runtime.py
          python3 scripts/test-codex-runtime-code-mode-probe.py
          python3 scripts/test-remote-dev-context7.py
          python3 scripts/test-remote-dev-context7-ownership.py
          python3 scripts/test_update_third_party_inventory.py
          python3 scripts/test_sync_python_runtime_notices.py
          python3 scripts/test_compact_python_runtime_notices.py
          python3 scripts/test_sync_standalone_artifact_inspection.py
          python3 scripts/test_validate_standalone_artifact_inspection.py
          python3 scripts/test_inspect_antigravity_cli.py
          python3 scripts/validate-release-channel-contract.py --root .
          python3 scripts/update-third-party-inventory.py --check
          python3 scripts/compact-python-runtime-notices.py --check
          python3 scripts/validate-standalone-artifact-inspection.py
          REMOTE_DEV_IMAGE_NAMES_LIB=./scripts/lib/remote-dev-image-names.sh \
            bash scripts/test-image-name-compat.sh
          bash scripts/test-compose-image-compat.sh
          REMOTE_DEV_LAUNCHER=./scripts/remote-dev-launcher.py \
            bash scripts/test-remote-dev-launcher.sh
          python3 scripts/test_single_stack_compose.py
          python3 scripts/test_canonical_data_layout.py
          python3 scripts/test_preflight_data_layout.py
          bash scripts/validate-version-pins.sh
          bash scripts/validate-third-party-inventory.sh
          bash scripts/test-source-revision.sh
          jq -e . renovate.json >/dev/null
          python3 scripts/validate-renovate-ownership.py --root .
          python3 scripts/test_validate_renovate_ownership.py
          python3 scripts/test_render_vulnerability_rescan_alert.py
          python3 scripts/test_resolve_published_image_digest.py
          python3 scripts/test_periodic_image_rescan_workflow.py
          python3 scripts/test_publish_edge_security_cadence.py
          jq -e '.schema_version == 2 and .blocking_findings == []' \
            third_party/antigravity-cli-inspection.json >/dev/null
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - name: Build and smoke test
        run: PLATFORM=linux/amd64 ./scripts/build-local.sh

      - name: Reproduce publisher mise isolation fixture
        run: bash scripts/test-mise-publisher-fixture.sh remote-dev:local

      - name: Compare failed published runtime child
        run: |
          published_ref="ghcr.io/experience83/remote-dev@sha256:7dd797bf1c39ecedd357adb78523aac1fd091f0d2d46f9db9e9037c94f8d7039"
          docker pull --quiet "$published_ref"
          bash scripts/test-mise-publisher-fixture.sh "$published_ref"

      - name: Verify canonical and legacy local aliases
        run: |
          set -euo pipefail
          canonical_base="$(docker image inspect remote-dev-base:local --format '{{.Id}}')"
          legacy_base="$(docker image inspect codex-remote-dev-base:local --format '{{.Id}}')"
          canonical_runtime="$(docker image inspect remote-dev:local --format '{{.Id}}')"
          legacy_runtime="$(docker image inspect codex-remote-dev:local --format '{{.Id}}')"
          test "$canonical_base" = "$legacy_base"
          test "$canonical_runtime" = "$legacy_runtime"

      - name: Verify bundled notices
        run: |
          docker run --rm --entrypoint remote-dev-notices \
            remote-dev-base:local --check
          docker run --rm --entrypoint remote-dev-notices \
            remote-dev:local --check

      - name: Generate base image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remote-dev-base:local
          format: spdx-json
          output: sbom-base.spdx.json

      - name: Generate Remote Dev image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remote-dev:local
          format: spdx-json
          output: sbom-remote-dev.spdx.json

      - name: Scan base image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remote-dev-base:local
          format: json
          output: trivy-base.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"

      - name: Scan Remote Dev image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remote-dev:local
          format: json
          output: trivy-remote-dev.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"

      - name: Upload security and SBOM reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-and-sbom-reports
          path: |
            sbom-base.spdx.json
            sbom-remote-dev.spdx.json
            trivy-base.json
            trivy-remote-dev.json
            third_party/components/remote-dev-ttyd-osc52/remote-dev-ttyd-osc52.spdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce no fixable critical vulnerabilities
        run: |
          bash scripts/enforce-trivy-gate.sh \
            "base image:trivy-base.json" \
            "Remote Dev image:trivy-remote-dev.json"
