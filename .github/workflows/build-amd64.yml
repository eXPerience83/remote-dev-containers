name: Build AMD64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Report latest stable upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report-upstream-versions.sh

      - name: Validate repository configuration
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash scripts/validate-version-pins.sh
          bash scripts/test-source-revision.sh
          jq -e . renovate.json >/dev/null
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - name: Build and smoke test
        run: PLATFORM=linux/amd64 ./scripts/build-local.sh

      - name: Scan base image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codex-remote-dev-base:local
          format: json
          output: trivy-base.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan Codex image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codex-remote-dev:local
          format: json
          output: trivy-codex.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload vulnerability scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-reports
          path: |
            trivy-base.json
            trivy-codex.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce no fixable critical vulnerabilities
        run: |
          set -euo pipefail
          findings=0

          for entry in \
            "base:trivy-base.json" \
            "codex:trivy-codex.json"; do
            label="${entry%%:*}"
            report="${entry#*:}"
            count="$(jq '[
              .Results[]?
              | .Vulnerabilities[]?
              | select(.Severity == "CRITICAL")
              | select((.FixedVersion // "") != "")
            ] | length' "$report")"

            if (( count > 0 )); then
              echo "ERROR: fixable CRITICAL vulnerabilities in $label image:" >&2
              jq -r '
                .Results[]? as $result
                | $result.Vulnerabilities[]?
                | select(.Severity == "CRITICAL")
                | select((.FixedVersion // "") != "")
                | "- \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) -> \(.FixedVersion) | \($result.Target)"
              ' "$report" >&2
            else
              echo "No fixable CRITICAL vulnerabilities in $label image."
            fi

            findings=$((findings + count))
          done

          if (( findings > 0 )); then
            echo "ERROR: vulnerability gate found $findings fixable CRITICAL finding(s)" >&2
            exit 1
          fi
