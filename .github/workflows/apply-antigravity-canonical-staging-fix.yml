name: Apply Antigravity canonical staging fix

on:
  push:
    branches:
      - fix/antigravity-install-stage
    paths:
      - .github/workflows/apply-antigravity-canonical-staging-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/antigravity-install-stage
          fetch-depth: 0

      - name: Apply reviewed fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manager = Path("scripts/remote-dev-antigravity.sh")
          text = manager.read_text(encoding="utf-8")
          old = '  cleanup_root="$(mktemp -d "${TMPDIR:-/tmp}/remote-dev-antigravity.XXXXXXXX")"\n'
          new = (
              '  install -d -m 0700 "$state_dir"\n'
              '  reject_symlink_components "$state_dir"\n'
              '  cleanup_root="$(mktemp -d "$state_dir/remote-dev-antigravity.XXXXXXXX")"\n'
          )
          if text.count(old) != 1:
              raise SystemExit("canonical manager staging anchor changed")
          manager.write_text(text.replace(old, new), encoding="utf-8")

          Path("scripts/remote-dev-install-antigravity.sh").write_text(
              '#!/usr/bin/env bash\nset -euo pipefail\nexec /usr/local/bin/remote-dev-antigravity install "$@"\n',
              encoding="utf-8",
          )
          Path("scripts/remote-dev-update-antigravity.sh").write_text(
              '#!/usr/bin/env bash\nset -euo pipefail\nexec /usr/local/bin/remote-dev-antigravity update "$@"\n',
              encoding="utf-8",
          )

          Path("scripts/test-antigravity-staging-wrappers.sh").write_text(
              '''#!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
          INSTALL_SOURCE="$ROOT/scripts/remote-dev-install-antigravity.sh"
          UPDATE_SOURCE="$ROOT/scripts/remote-dev-update-antigravity.sh"

          temporary="$(mktemp -d)"
          trap 'rm -rf -- "$temporary"' EXIT

          manager="$temporary/remote-dev-antigravity"
          install_wrapper="$temporary/remote-dev-install-antigravity"
          update_wrapper="$temporary/remote-dev-update-antigravity"
          record="$temporary/manager-record"

          fail() {
            printf 'FAIL: %s\\n' "$*" >&2
            exit 1
          }

          cat >"$manager" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${REMOTE_DEV_TEST_RECORD:?}"
          printf '%s\\n' "$@" >"$REMOTE_DEV_TEST_RECORD"
          EOF
          chmod 0755 "$manager"

          prepare_wrapper() {
            local source="$1"
            local destination="$2"
            python3 - "$source" "$destination" "$manager" <<'PYINNER'
          from pathlib import Path
          import shlex
          import sys

          source, destination = map(Path, sys.argv[1:3])
          manager = sys.argv[3]
          text = source.read_text(encoding="utf-8")
          old = "/usr/local/bin/remote-dev-antigravity"
          if text.count(old) != 1:
              raise SystemExit("expected one manager wrapper anchor")
          destination.write_text(text.replace(old, shlex.quote(manager)), encoding="utf-8")
          PYINNER
            chmod 0755 "$destination"
          }

          prepare_wrapper "$INSTALL_SOURCE" "$install_wrapper"
          prepare_wrapper "$UPDATE_SOURCE" "$update_wrapper"
          export REMOTE_DEV_TEST_RECORD="$record"

          "$install_wrapper" --yes 'literal space'
          mapfile -t install_args <"$record"
          test "${install_args[0]}" = install || fail "install wrapper changed the action"
          test "${install_args[1]}" = --yes || fail "install wrapper changed the first argument"
          test "${install_args[2]}" = 'literal space' || fail "install wrapper changed a literal argument"

          "$update_wrapper" --yes
          mapfile -t update_args <"$record"
          test "${update_args[0]}" = update || fail "update wrapper changed the action"
          test "${update_args[1]}" = --yes || fail "update wrapper changed the argument"

          grep -Fq 'mktemp -d "$state_dir/remote-dev-antigravity.XXXXXXXX"' \
            "$ROOT/scripts/remote-dev-antigravity.sh" \
            || fail "canonical manager does not own the staging path"
          ! grep -Fq '${TMPDIR:-/tmp}/remote-dev-antigravity' \
            "$ROOT/scripts/remote-dev-antigravity.sh" \
            || fail "canonical manager still honors caller-controlled TMPDIR"

          echo 'Antigravity canonical staging and wrapper regressions: OK'
          ''',
              encoding="utf-8",
          )
          PY

          chmod 0755 \
            scripts/remote-dev-antigravity.sh \
            scripts/remote-dev-install-antigravity.sh \
            scripts/remote-dev-update-antigravity.sh \
            scripts/test-antigravity-staging-wrappers.sh

          bash -n \
            scripts/remote-dev-antigravity.sh \
            scripts/remote-dev-install-antigravity.sh \
            scripts/remote-dev-update-antigravity.sh \
            scripts/test-antigravity-staging-wrappers.sh
          bash scripts/test-antigravity-runtime.sh
          bash scripts/test-antigravity-security-regressions.sh
          bash scripts/test-antigravity-staging-wrappers.sh

      - name: Commit reviewed fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-antigravity-canonical-staging-fix.yml
          git add \
            scripts/remote-dev-antigravity.sh \
            scripts/remote-dev-install-antigravity.sh \
            scripts/remote-dev-update-antigravity.sh \
            scripts/test-antigravity-staging-wrappers.sh
          git commit -m "fix: enforce canonical Antigravity staging policy"
          git push origin HEAD:fix/antigravity-install-stage
