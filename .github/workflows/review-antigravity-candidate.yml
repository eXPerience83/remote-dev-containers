name: Review Antigravity candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  candidate:
    name: inspect the current explicitly approved pending candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      installer_sha256: ${{ steps.pending-candidate.outputs.installer_sha256 }}
      payload_sha256: ${{ steps.pending-candidate.outputs.payload_sha256 }}

    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            || { echo "ERROR: Antigravity candidate review may only run from main" >&2; exit 1; }

      - name: Checkout reviewed automation code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate the current pending static candidate
        id: pending-candidate
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/antigravity-pending-candidate"
          branch="automation/update-upstreams"
          candidate_ref="refs/remotes/origin/$branch"
          detection_path="$workdir/detection.json"
          discovery_path="$workdir/discovery.json"
          install -d -m 0700 "$workdir"

          # The manual workflow dispatch is the human admission boundary. Read
          # only normalized metadata from the pending automation branch as data;
          # execute only the workflow and scripts checked out from trusted main.
          git fetch --no-tags origin "refs/heads/$branch:$candidate_ref" \
            || { echo "ERROR: no pending automation candidate exists; run Check upstream versions first" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" "$candidate_ref" \
            || { echo "ERROR: pending automation branch does not contain this main revision; rerun Check upstream versions first" >&2; exit 1; }
          git show "$candidate_ref:third_party/antigravity-cli-detection.json" > "$detection_path" \
            || { echo "ERROR: pending branch has no Antigravity detection metadata" >&2; exit 1; }
          git show "$candidate_ref:third_party/antigravity-cli-candidate.json" > "$discovery_path" \
            || { echo "ERROR: pending branch has no static Antigravity candidate to approve" >&2; exit 1; }

          python3 scripts/validate-antigravity-review-artifact.py \
            --kind detection \
            --artifact "$detection_path"
          installer_sha="$(jq -er '.installer.sha256 | select(test("^[0-9a-f]{64}$"))' "$detection_path")"
          baseline_sha="$(jq -er '.installer.sha256 | select(test("^[0-9a-f]{64}$"))' third_party/antigravity-cli-inspection.json)"
          artifact_baseline="$(jq -er '.reviewed_installer_sha256 | select(test("^[0-9a-f]{64}$"))' "$detection_path")"
          [[ "$artifact_baseline" == "$baseline_sha" ]] \
            || { echo "ERROR: pending detection was not generated from this main revision's reviewed baseline" >&2; exit 1; }

          python3 scripts/validate-antigravity-review-artifact.py \
            --kind discovery \
            --artifact "$discovery_path" \
            --expected-installer-sha256 "$installer_sha"
          payload_sha="$(jq -er '.payload.sha256 | select(test("^[0-9a-f]{64}$"))' "$discovery_path")"

          echo "Human workflow dispatch admits the current validated pending pair:"
          echo "  installer SHA-256: $installer_sha"
          echo "  agy SHA-256:       $payload_sha"
          echo "installer_sha256=$installer_sha" >> "$GITHUB_OUTPUT"
          echo "payload_sha256=$payload_sha" >> "$GITHUB_OUTPUT"

      - name: Execute bounded hash-admitted full inspection
        env:
          INSTALLER_SHA256: ${{ steps.pending-candidate.outputs.installer_sha256 }}
          PAYLOAD_SHA256: ${{ steps.pending-candidate.outputs.payload_sha256 }}
          ARTIFACT_PATH: ${{ runner.temp }}/antigravity-review.json
        run: |
          set -euo pipefail
          python3 scripts/run-antigravity-inspection.py \
            --output "$ARTIFACT_PATH" \
            --expected-installer-sha256 "$INSTALLER_SHA256" \
            --expected-binary-sha256 "$PAYLOAD_SHA256"
          python3 scripts/validate-antigravity-review-artifact.py \
            --kind inspection \
            --artifact "$ARTIFACT_PATH" \
            --expected-installer-sha256 "$INSTALLER_SHA256" \
            --expected-payload-sha256 "$PAYLOAD_SHA256"

      - name: Upload metadata only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: antigravity-review-metadata
          path: ${{ runner.temp }}/antigravity-review.json
          if-no-files-found: error
          retention-days: 3

  maintain-pr:
    name: update the human-reviewed automation PR
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout trusted main with branch-maintenance credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: antigravity-review-metadata
          path: ${{ runner.temp }}/antigravity-review-artifact

      - name: Revalidate artifact after crossing into the write-capable job
        env:
          INSTALLER_SHA256: ${{ needs.candidate.outputs.installer_sha256 }}
          PAYLOAD_SHA256: ${{ needs.candidate.outputs.payload_sha256 }}
          ARTIFACT_PATH: ${{ runner.temp }}/antigravity-review-artifact/antigravity-review.json
        run: |
          set -euo pipefail
          python3 scripts/validate-antigravity-review-artifact.py \
            --kind inspection \
            --artifact "$ARTIFACT_PATH" \
            --expected-installer-sha256 "$INSTALLER_SHA256" \
            --expected-payload-sha256 "$PAYLOAD_SHA256"

      - name: Update the single automation branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_SHA256: ${{ needs.candidate.outputs.installer_sha256 }}
          PAYLOAD_SHA256: ${{ needs.candidate.outputs.payload_sha256 }}
          ARTIFACT_PATH: ${{ runner.temp }}/antigravity-review-artifact/antigravity-review.json
        run: |
          set -euo pipefail
          branch="automation/update-upstreams"
          remote_ref="refs/remotes/origin/$branch"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            || { echo "ERROR: write-capable Antigravity review may only run from main" >&2; exit 1; }
          [[ "$INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "ERROR: installer admission is not normalized" >&2; exit 1; }
          [[ "$PAYLOAD_SHA256" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "ERROR: payload admission is not normalized" >&2; exit 1; }

          git fetch origin main
          set +e
          git ls-remote --exit-code --heads origin "$branch" >/dev/null
          remote_status=$?
          set -e
          case "$remote_status" in
            0)
              git fetch origin "refs/heads/$branch:$remote_ref"
              git checkout -B "$branch" "$remote_ref"
              git merge-base --is-ancestor origin/main HEAD \
                || { echo "ERROR: automation branch does not contain current main; rerun Check upstream versions first" >&2; exit 1; }
              ;;
            2)
              echo "ERROR: no pending automation candidate exists; run Check upstream versions first" >&2
              exit 1
              ;;
            *)
              echo "ERROR: could not determine automation branch state" >&2
              exit "$remote_status"
              ;;
          esac

          python3 scripts/validate-antigravity-review-artifact.py \
            --kind detection \
            --artifact third_party/antigravity-cli-detection.json \
            --expected-installer-sha256 "$INSTALLER_SHA256"
          [[ -f third_party/antigravity-cli-candidate.json ]] \
            || { echo "ERROR: inspection requires the same previously validated static candidate" >&2; exit 1; }
          python3 scripts/validate-antigravity-review-artifact.py \
            --kind discovery \
            --artifact third_party/antigravity-cli-candidate.json \
            --expected-installer-sha256 "$INSTALLER_SHA256"
          candidate_payload_sha="$(jq -er '.payload.sha256 | select(test("^[0-9a-f]{64}$"))' third_party/antigravity-cli-candidate.json)"
          [[ "$candidate_payload_sha" == "$PAYLOAD_SHA256" ]] \
            || { echo "ERROR: admitted payload does not match the pending statically discovered candidate" >&2; exit 1; }

          python3 scripts/update-antigravity-review-evidence.py \
            --live "$ARTIFACT_PATH" \
            --detection third_party/antigravity-cli-detection.json \
            --current third_party/antigravity-cli-inspection.json \
            --output "$workdir/reviewed.json"
          install -m 0644 "$workdir/reviewed.json" third_party/antigravity-cli-inspection.json

          git show origin/main:third_party/antigravity-cli-inspection.json \
            > "$workdir/baseline-reviewed.json"
          python3 scripts/reconcile-antigravity-review-state.py \
            --live-detection third_party/antigravity-cli-detection.json \
            --baseline-reviewed "$workdir/baseline-reviewed.json" \
            --proposed-reviewed third_party/antigravity-cli-inspection.json \
            --proposed-discovery third_party/antigravity-cli-candidate.json \
            --reviewed-output "$workdir/reconciled-reviewed.json" \
            --detection-output "$workdir/reconciled-detection.json" \
            --discovery-output third_party/antigravity-cli-candidate.json
          install -m 0644 "$workdir/reconciled-reviewed.json" third_party/antigravity-cli-inspection.json
          install -m 0644 "$workdir/reconciled-detection.json" third_party/antigravity-cli-detection.json
          python3 scripts/update-antigravity-review-doc.py \
            --reviewed third_party/antigravity-cli-inspection.json \
            --write

          version="$(jq -er '.installed_binary.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+([+-][A-Za-z0-9._-]+)?$"))' third_party/antigravity-cli-inspection.json)"
          title="chore: review upstream updates"
          body="Antigravity full candidate inspection is complete for the current pending installer SHA-256 ${INSTALLER_SHA256} and agy SHA-256 ${PAYLOAD_SHA256}, explicitly admitted by the manual workflow dispatch. The normalized committed review records agy ${version}; the static candidate file has been removed because the full review supersedes it. The vendor-execution job had no repository write permission and uploaded no proprietary bytes or raw stdout/stderr. Human review is still required: verify normalized evidence, compatibility findings, current Google terms/privacy policy and the preserved non-redistribution/non-affiliation policy before merge. Runtime availability remains independent of this review PR."

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add third_party/antigravity-cli-detection.json \
            third_party/antigravity-cli-inspection.json \
            third_party/antigravity-cli-inspection.md
          git add -u third_party/antigravity-cli-candidate.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Antigravity reviewed evidence"
            git push -u origin "$branch"
          else
            echo "Automation branch already contains this Antigravity full review."
          fi

          existing_pr="$(gh pr list \
            --head "$branch" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --title "$title" --body "$body"
          else
            gh pr create --title "$title" --body "$body" --base main --head "$branch"
          fi

          branch_head="$(git rev-parse HEAD)"
          run_json="$(gh run list \
            --workflow build-amd64.yml \
            --branch "$branch" \
            --event workflow_dispatch \
            --commit "$branch_head" \
            --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0] // {}')"
          run_id="$(jq -r '.databaseId // empty' <<<"$run_json")"
          run_status="$(jq -r '.status // empty' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          if [[ -z "$run_id" || ( "$run_status" == "completed" && "$run_conclusion" != "success" ) ]]; then
            gh workflow run build-amd64.yml --ref "$branch"
          else
            echo "Build AMD64 run $run_id is already $run_status${run_conclusion:+/$run_conclusion} for $branch_head."
          fi
