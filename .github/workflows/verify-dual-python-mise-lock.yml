# Temporary read-only verification for issue #270; delete before merging.
name: Regenerate dual Python mise lock (temporary)

on:
  push:
    branches:
      - feat/270-dual-python-314-315
    paths:
      - .github/workflows/verify-dual-python-mise-lock.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned mise and regenerate lock from isolated state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source versions.env
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd
          mkdir -p "$RUNNER_TEMP/bin"
          binary="$RUNNER_TEMP/bin/mise"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 300 \
            "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64" \
            -o "$binary"
          printf '%s  %s\n' "$MISE_AMD64_SHA256" "$binary" | sha256sum -c -
          chmod 0755 "$binary"
          cp mise.lock "$RUNNER_TEMP/committed.lock"
          MISE_BIN="$binary" bash scripts/regenerate-mise-lock.sh
          mkdir -p locked-result
          cp mise.lock locked-result/mise.lock
          if ! cmp -s "$RUNNER_TEMP/committed.lock" mise.lock; then
            echo "Generated lock differs from reviewed candidate; inspect artifact before acceptance."
            diff -u "$RUNNER_TEMP/committed.lock" mise.lock || true
          else
            echo "Generated dual-Python lock matches committed candidate byte-for-byte."
          fi
      - name: Upload exact generated lock artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dual-python-regenerated-mise-lock
          path: locked-result/mise.lock
          if-no-files-found: error
          retention-days: 7
