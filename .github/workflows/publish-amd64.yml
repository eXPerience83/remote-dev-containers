name: Publish AMD64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-stable-amd64
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - name: Validate stable release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: stable publication requires an exact vMAJOR.MINOR.PATCH tag; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Validate repository configuration
        run: |
          bash -n scripts/*.sh
          bash scripts/validate-version-pins.sh
          jq -e . renovate.json >/dev/null

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Resolve lowercase GHCR namespace
        id: registry
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Load versions
        id: versions
        run: |
          source versions.env
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "ubuntu_version=$UBUNTU_VERSION" >> "$GITHUB_OUTPUT"
          echo "codex_tag=$CODEX_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "gh_version=$GH_VERSION" >> "$GITHUB_OUTPUT"
          echo "ttyd_version=$TTYD_VERSION" >> "$GITHUB_OUTPUT"
          echo "mise_version=$MISE_VERSION" >> "$GITHUB_OUTPUT"
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "uv_version=$UV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            UBUNTU_VERSION=${{ steps.versions.outputs.ubuntu_version }}
            BASE_VERSION=${{ steps.versions.outputs.base_version }}
            GH_VERSION=${{ steps.versions.outputs.gh_version }}
            TTYD_VERSION=${{ steps.versions.outputs.ttyd_version }}
            MISE_VERSION=${{ steps.versions.outputs.mise_version }}
            PYTHON_VERSION=${{ steps.versions.outputs.python_version }}
            NODE_VERSION=${{ steps.versions.outputs.node_version }}
            UV_VERSION=${{ steps.versions.outputs.uv_version }}
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/remote-dev-base:${{ github.ref_name }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/remote-dev-base:stable-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Build and publish Codex image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/codex/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.registry.outputs.namespace }}/remote-dev-base:${{ github.ref_name }}
            CODEX_RELEASE_TAG=${{ steps.versions.outputs.codex_tag }}
            PROJECT_VERSION=${{ github.ref_name }}
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.registry.outputs.namespace }}/codex-remote-dev:${{ github.ref_name }}
            ghcr.io/${{ steps.registry.outputs.namespace }}/codex-remote-dev:stable
            ghcr.io/${{ steps.registry.outputs.namespace }}/codex-remote-dev:stable-amd64
            ghcr.io/${{ steps.registry.outputs.namespace }}/codex-remote-dev:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
