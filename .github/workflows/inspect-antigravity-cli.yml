name: Inspect Antigravity CLI

on:
  pull_request:
    paths:
      - ".github/workflows/inspect-antigravity-cli.yml"
      - ".github/workflows/review-antigravity-candidate.yml"
      - ".github/workflows/check-upstream.yml"
      - "scripts/inspect-antigravity-cli.py"
      - "scripts/detect-antigravity-installer.py"
      - "scripts/discover-antigravity-payload.py"
      - "scripts/reconcile-antigravity-review-state.py"
      - "scripts/update-antigravity-review-evidence.py"
      - "scripts/update-antigravity-review-doc.py"
      - "scripts/validate-antigravity-review-artifact.py"
      - "scripts/test_inspect_antigravity_cli.py"
      - "scripts/test_detect_antigravity_installer.py"
      - "scripts/test_discover_antigravity_payload.py"
      - "scripts/test_reconcile_antigravity_review_state.py"
      - "scripts/test_update_antigravity_review_evidence.py"
      - "scripts/test_update_antigravity_review_doc.py"
      - "scripts/test_validate_antigravity_review_artifact.py"
      - "scripts/test_optional_review_workflows.py"
      - "scripts/fixtures/antigravity-install.sh"
      - "third_party/antigravity-cli-detection.json"
      - "third_party/antigravity-cli-inspection.json"
      - "third_party/antigravity-cli-inspection.md"
      - "third_party/optional-agents.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate inspection and review contracts offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout without repository credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Antigravity review implementation without live vendor execution
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/inspect-antigravity-cli.py \
            scripts/detect-antigravity-installer.py \
            scripts/discover-antigravity-payload.py \
            scripts/reconcile-antigravity-review-state.py \
            scripts/update-antigravity-review-evidence.py \
            scripts/update-antigravity-review-doc.py \
            scripts/validate-antigravity-review-artifact.py \
            scripts/test_inspect_antigravity_cli.py \
            scripts/test_detect_antigravity_installer.py \
            scripts/test_discover_antigravity_payload.py \
            scripts/test_reconcile_antigravity_review_state.py \
            scripts/test_update_antigravity_review_evidence.py \
            scripts/test_update_antigravity_review_doc.py \
            scripts/test_validate_antigravity_review_artifact.py \
            scripts/test_optional_review_workflows.py

          python3 scripts/test_inspect_antigravity_cli.py
          python3 scripts/test_detect_antigravity_installer.py
          python3 scripts/test_discover_antigravity_payload.py
          python3 scripts/test_reconcile_antigravity_review_state.py
          python3 scripts/test_update_antigravity_review_evidence.py
          python3 scripts/test_update_antigravity_review_doc.py
          python3 scripts/test_validate_antigravity_review_artifact.py
          python3 scripts/test_optional_review_workflows.py

          jq -e '.schema_version == 2 and .blocking_findings == []' \
            third_party/antigravity-cli-inspection.json >/dev/null
          python3 scripts/validate-antigravity-review-artifact.py \
            --kind detection \
            --artifact third_party/antigravity-cli-detection.json
          python3 scripts/update-antigravity-review-doc.py \
            --reviewed third_party/antigravity-cli-inspection.json

          echo "Antigravity PR validation is offline; live review requires explicit hash admission."
