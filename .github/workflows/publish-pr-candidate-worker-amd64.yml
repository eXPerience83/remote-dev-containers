name: Publish reviewed PR candidate worker AMD64

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Authorized pull request number
        required: true
        type: string
      head_sha:
        description: Authorized full pull-request HEAD SHA
        required: true
        type: string
      authorization_comment_id:
        description: Owner authorization comment ID
        required: true
        type: string

permissions:
  contents: read

# `dev` is a single mutable pre-merge channel. Serialize the trusted worker so
# two explicitly authorized candidate publications cannot race its promotion.
concurrency:
  group: publish-pr-candidate-dev-amd64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    cache-mode: write-only
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.candidate.outputs.pr_number }}
      head_sha: ${{ steps.candidate.outputs.head_sha }}
      short_sha: ${{ steps.candidate.outputs.short_sha }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      authorization_comment_id: ${{ steps.candidate.outputs.comment_id }}
      cache_key: ${{ steps.candidate.outputs.cache_key }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}

    steps:
      - name: Revalidate owner authorization and pull-request head
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_COMMENT_ID: ${{ inputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: candidate worker must run from refs/heads/main; got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$INPUT_PR_NUMBER" =~ ^[0-9]+$ || ! "$INPUT_COMMENT_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: invalid PR/comment identity" >&2
            exit 1
          fi
          if [[ ! "$INPUT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid authorized HEAD SHA" >&2
            exit 1
          fi

          comment_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${INPUT_COMMENT_ID}")"
          comment_user="$(jq -r '.user.login' <<<"$comment_json")"
          comment_body="$(jq -r '.body' <<<"$comment_json")"
          comment_issue_url="$(jq -r '.issue_url' <<<"$comment_json")"
          comment_issue_number="${comment_issue_url##*/}"
          expected_body="/publish-candidate ${INPUT_HEAD_SHA}"

          if [[ "$comment_user" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "ERROR: authorization comment is not owned by $GITHUB_REPOSITORY_OWNER" >&2
            exit 1
          fi
          if [[ "$comment_issue_number" != "$INPUT_PR_NUMBER" ]]; then
            echo "ERROR: authorization comment belongs to issue $comment_issue_number, not PR $INPUT_PR_NUMBER" >&2
            exit 1
          fi
          if [[ "$comment_body" != "$expected_body" ]]; then
            echo "ERROR: authorization comment no longer matches the exact requested SHA" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"

          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "ERROR: candidate publication is limited to branches in $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$base_ref" != main ]]; then
            echo "ERROR: candidate pull request must target main; got $base_ref" >&2
            exit 1
          fi
          if [[ "$state" != open ]]; then
            echo "ERROR: candidate pull request must be open; got $state" >&2
            exit 1
          fi
          for revision in "$head_sha" "$base_sha"; do
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "ERROR: invalid pull-request revision: $revision" >&2
              exit 1
            fi
          done
          if [[ "$head_sha" != "$INPUT_HEAD_SHA" ]]; then
            echo "ERROR: authorized SHA $INPUT_HEAD_SHA is no longer PR HEAD $head_sha" >&2
            exit 1
          fi

          short_sha="${head_sha:0:12}"
          cache_key="candidate-images-run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}-pr-${INPUT_PR_NUMBER}-${head_sha}"
          echo "pr_number=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "comment_id=$INPUT_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.head_sha }}
          persist-credentials: false

      - name: Verify the checked-out revision
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: checked out $actual_sha instead of $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Validate repository configuration
        run: |
          set -euo pipefail
          test -d scripts
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          REMOTE_DEV_IMAGE_NAMES_LIB=./scripts/lib/remote-dev-image-names.sh \
            bash scripts/test-image-name-compat.sh
          bash scripts/test-image-identity.sh
          python3 scripts/test_edge_build_identity.py
          python3 scripts/test_update_upstream_changelog.py
          bash scripts/validate-version-pins.sh
          bash scripts/test-source-revision.sh
          jq -e . renovate.json >/dev/null
          python3 scripts/validate-renovate-ownership.py --root .
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - name: Build and smoke test the exact candidate
        env:
          PLATFORM: linux/amd64
          PROJECT_VERSION: candidate-pr-${{ steps.candidate.outputs.pr_number }}
          PROJECT_CHANNEL: dev
          SOURCE_REVISION: ${{ steps.candidate.outputs.head_sha }}
        run: ./scripts/build-local.sh

      - name: Export canonical candidate images
        id: archive
        run: |
          set -euo pipefail
          archive_dir="${RUNNER_TEMP}/candidate-transfer"
          archive="${archive_dir}/candidate-images.tar.gz"
          rm -rf "$archive_dir"
          mkdir -p "$archive_dir"
          docker save remote-dev-base:local remote-dev:local | gzip -1 > "$archive"
          test -f "$archive"
          test ! -L "$archive"
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid candidate archive SHA-256: $sha256" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Save verified candidate transfer cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/candidate-transfer/candidate-images.tar.gz
          key: ${{ steps.candidate.outputs.cache_key }}

  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    cache-mode: read
    permissions:
      actions: read
      contents: read
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}

    steps:
      - name: Restore exact candidate transfer cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/candidate-transfer/candidate-images.tar.gz
          key: ${{ needs.build.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Hash and load the candidate images
        id: archive
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/candidate-transfer/candidate-images.tar.gz"
          test -f "$archive"
          test ! -L "$archive"
          sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid candidate archive SHA-256: $sha256" >&2
            exit 1
          fi
          if [[ "$sha256" != "$EXPECTED_SHA256" ]]; then
            echo "ERROR: candidate transfer cache changed after build validation" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          gzip -dc "$archive" | docker load

      - name: Verify embedded candidate identity
        env:
          EXPECTED_SOURCE: ${{ needs.build.outputs.head_sha }}
          EXPECTED_VERSION: candidate-pr-${{ needs.build.outputs.pr_number }}
          EXPECTED_CHANNEL: dev
        run: |
          set -euo pipefail
          output="$(docker run --rm --entrypoint /usr/local/bin/remote-dev-version remote-dev:local)"
          grep -Fxq "Image version: $EXPECTED_VERSION" <<<"$output"
          grep -Fxq "Channel: $EXPECTED_CHANNEL" <<<"$output"
          grep -Fxq "Source revision: $EXPECTED_SOURCE" <<<"$output"

      - name: Checkout the trusted base revision for the vulnerability gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.base_sha }}
          persist-credentials: false

      - name: Scan base image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remote-dev-base:local
          format: json
          output: trivy-candidate-base.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"

      - name: Scan final image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remote-dev:local
          format: json
          output: trivy-candidate-remote-dev.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"

      - name: Enforce no fixable critical vulnerabilities
        run: |
          set -euo pipefail
          bash scripts/enforce-trivy-gate.sh \
            "candidate base image:trivy-candidate-base.json" \
            "candidate Remote Dev image:trivy-candidate-remote-dev.json"

      - name: Upload candidate vulnerability reports on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-trivy-pr-${{ needs.build.outputs.pr_number }}-${{ needs.build.outputs.short_sha }}
          path: |
            trivy-candidate-base.json
            trivy-candidate-remote-dev.json
          if-no-files-found: warn
          retention-days: 3

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    cache-mode: read
    permissions:
      actions: read
      issues: read
      packages: write
      pull-requests: write

    steps:
      - name: Restore exact verified candidate transfer cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/candidate-transfer/candidate-images.tar.gz
          key: ${{ needs.build.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Match the verified archive and load the images
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/candidate-transfer/candidate-images.tar.gz"
          test -f "$archive"
          test ! -L "$archive"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "ERROR: candidate transfer cache changed after verification" >&2
            echo "Expected: $EXPECTED_SHA256" >&2
            echo "Actual:   $actual_sha256" >&2
            exit 1
          fi
          gzip -dc "$archive" | docker load

      - name: Revalidate authorization before registry publication
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          AUTHORIZED_SHA: ${{ needs.build.outputs.head_sha }}
          COMMENT_ID: ${{ needs.build.outputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          comment_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}")"
          comment_user="$(jq -r '.user.login' <<<"$comment_json")"
          comment_body="$(jq -r '.body' <<<"$comment_json")"
          comment_issue_url="$(jq -r '.issue_url' <<<"$comment_json")"
          comment_issue_number="${comment_issue_url##*/}"
          expected_body="/publish-candidate ${AUTHORIZED_SHA}"
          if [[ "$comment_user" != "$GITHUB_REPOSITORY_OWNER" || "$comment_issue_number" != "$PR_NUMBER" || "$comment_body" != "$expected_body" ]]; then
            echo "ERROR: candidate authorization changed before registry publication" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_state="$(jq -r '.state' <<<"$pr_json")"
          current_base="$(jq -r '.base.ref' <<<"$pr_json")"
          current_head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          current_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [[ "$current_state" != open || "$current_base" != main || "$current_head_repo" != "$GITHUB_REPOSITORY" || "$current_head_sha" != "$AUTHORIZED_SHA" ]]; then
            echo "ERROR: PR authorization changed before registry publication" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Publish the exact candidate tag
        id: image
        env:
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${namespace}/remote-dev"
          tag="candidate-pr-${PR_NUMBER}-${SHORT_SHA}"
          ref="${image}:${tag}"

          docker tag remote-dev:local "$ref"
          docker push "$ref"

          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: could not resolve the published candidate digest: $digest" >&2
            exit 1
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "source=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "dev_ref=${image}:dev-amd64" >> "$GITHUB_OUTPUT"

      - name: Revalidate authorization immediately before dev promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          AUTHORIZED_SHA: ${{ needs.build.outputs.head_sha }}
          COMMENT_ID: ${{ needs.build.outputs.authorization_comment_id }}
        run: |
          set -euo pipefail
          comment_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}")"
          comment_user="$(jq -r '.user.login' <<<"$comment_json")"
          comment_body="$(jq -r '.body' <<<"$comment_json")"
          comment_issue_url="$(jq -r '.issue_url' <<<"$comment_json")"
          comment_issue_number="${comment_issue_url##*/}"
          expected_body="/publish-candidate ${AUTHORIZED_SHA}"
          if [[ "$comment_user" != "$GITHUB_REPOSITORY_OWNER" || "$comment_issue_number" != "$PR_NUMBER" || "$comment_body" != "$expected_body" ]]; then
            echo "ERROR: candidate authorization changed before dev promotion" >&2
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_state="$(jq -r '.state' <<<"$pr_json")"
          current_base="$(jq -r '.base.ref' <<<"$pr_json")"
          current_head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          current_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          if [[ "$current_state" != open || "$current_base" != main || "$current_head_repo" != "$GITHUB_REPOSITORY" || "$current_head_sha" != "$AUTHORIZED_SHA" ]]; then
            echo "ERROR: PR authorization changed before dev promotion" >&2
            exit 1
          fi

      - name: Promote exact candidate digest to dev aliases
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_REF%:*}"
          tag="${IMAGE_REF##*:}"
          source_ref="${image}@${IMAGE_DIGEST}"

          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file dev-promotion.json \
            --tag "${image}:dev" \
            --tag "${image}:dev-amd64" \
            "$source_ref"

          for published_tag in "$tag" dev dev-amd64; do
            published_ref="${image}:${published_tag}"
            actual_digest="$(
              docker buildx imagetools inspect "$published_ref" \
                --format '{{json .Manifest.Digest}}' | tr -d '"'
            )"
            if [[ "$actual_digest" != "$IMAGE_DIGEST" ]]; then
              echo "ERROR: $published_ref resolved to $actual_digest instead of $IMAGE_DIGEST" >&2
              exit 1
            fi
          done

      - name: Comment the exact candidate on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ steps.image.outputs.source }}
          DEV_REF: ${{ steps.image.outputs.dev_ref }}
        run: |
          set -euo pipefail
          immutable_ref="${IMAGE_REF%:*}@${IMAGE_DIGEST}"
          body="$(cat <<EOF
          Published an isolated AMD64 candidate after smoke tests, independent transfer-cache verification and the fixable-critical vulnerability gate passed.

          - Candidate tag: \`${IMAGE_REF}\`
          - Dev channel: \`${DEV_REF}\`
          - Immutable reference: \`${immutable_ref}\`
          - Source revision: \`${SOURCE_REVISION}\`
          - Triggering worker run: \`${GITHUB_RUN_ID}\`

          The mutable \`dev\` channel now points to this exact candidate. It may contain unmerged code and is not \`edge\`, \`stable\` or \`latest\`. Use the immutable digest for exact TrueNAS validation and rollback evidence.
          EOF
          )"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"

  cleanup:
    needs: [build, verify, publish]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: none
    permissions:
      actions: write

    steps:
      - name: Delete transfer cache after build handoff
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ needs.build.outputs.cache_key }}
        run: |
          set -euo pipefail
          response="$(
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}&ref=refs/heads/main"
          )"
          deleted_count="$(jq -r '.total_count // 0' <<<"$response")"
          if [[ "$deleted_count" != "1" ]]; then
            echo "ERROR: expected exactly one transfer cache for $CACHE_KEY; deleted: $deleted_count" >&2
            exit 1
          fi
