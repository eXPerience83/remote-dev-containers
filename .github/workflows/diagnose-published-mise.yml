name: Diagnose published mise

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  published-mise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@5b7b28b1cc417bbd34cd8c225a957c9ce9adf7f2 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare failed published base and runtime children
        shell: bash
        run: |
          set -uo pipefail
          base_ref="ghcr.io/experience83/remote-dev-base@sha256:b6044e79005a4e8f987a11d50292e6a9adfa4744e14a06d5bc2b7b13218c4dbe"
          runtime_ref="ghcr.io/experience83/remote-dev@sha256:7dd797bf1c39ecedd357adb78523aac1fd091f0d2d46f9db9e9037c94f8d7039"

          docker pull --quiet "$base_ref"
          docker pull --quiet "$runtime_ref"

          base_status=0
          runtime_status=0
          bash scripts/test-mise-publisher-fixture.sh "$base_ref" || base_status=$?
          bash scripts/test-mise-publisher-fixture.sh "$runtime_ref" || runtime_status=$?

          printf 'Published base mise fixture exit=%s\n' "$base_status"
          printf 'Published runtime mise fixture exit=%s\n' "$runtime_status"

          # This is evidence-only while #212 is under investigation. A failing
          # historical digest is expected and must not be converted into a
          # publisher bypass. Keep the step green so both results are captured.
          exit 0
