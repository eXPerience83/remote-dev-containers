name: Capture Chromium archive digests for review
on:
  pull_request:
    paths:
      - .github/workflows/chromium-archive-digest-capture.yml
permissions:
  contents: read
jobs:
  capture:
    name: Verify source archive on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and hash pinned Playwright headless shell archive
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/playwright-archive-verification"
          cd "$RUNNER_TEMP/playwright-archive-verification"
          cp "$GITHUB_WORKSPACE/config/playwright-package.json" package.json
          cp "$GITHUB_WORKSPACE/config/playwright-package-lock.json" package-lock.json
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
          ./node_modules/.bin/playwright install --dry-run --only-shell chromium > dry-run.txt
          cat dry-run.txt
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse
          lines = Path('dry-run.txt').read_text().splitlines()
          urls = re.findall(r'^\s*Download url:\s*(https://\S+)\s*$', '\n'.join(lines), re.M)
          locations = re.findall(r'^\s*Install location:\s*(\S+)\s*$', '\n'.join(lines), re.M)
          assert len(urls) == 1 and len(locations) == 1, lines
          browser = json.loads(Path('node_modules/playwright-core/browsers.json').read_text())
          entries = [e for e in browser['browsers'] if e['name'] == 'chromium-headless-shell']
          assert len(entries) == 1, entries
          entry = entries[0]
          assert Path(locations[0]).name == 'chromium_headless_shell-' + entry['revision'], (locations, entry)
          url = urlparse(urls[0])
          assert url.scheme == 'https' and not url.username and not url.password
          assert 'chrome-headless-shell' in url.path, url.path
          arch = os.environ['ARCH']
          assert ('linux-arm64' if arch == 'arm64' else 'linux64') in url.path, url.path
          info = dict(url=urls[0], revision=entry['revision'], browserVersion=entry['browserVersion'], arch=arch)
          Path('metadata.json').write_text(json.dumps(info))
          Path('browser-url.txt').write_text(urls[0])
          print('Verified metadata:', json.dumps(info, sort_keys=True))
          PY
          url="$(cat browser-url.txt)"
          curl --fail --show-error --silent --location \
            --retry 3 --connect-timeout 25 --max-time 700 \
            --output chromium-headless-shell.zip "$url"
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('chromium-headless-shell.zip') as z:
              bad = z.testzip()
              assert bad is None, bad
              members = z.namelist()
              assert 4 <= len(members) <= 10000, len(members)
              print('Archive entries:',len(members),'first:',members[:6])
          PY
          printf 'BEGIN_CHROMIUM_ARCHIVE_DIGEST_%s\n' "$ARCH"
          sha256sum chromium-headless-shell.zip
          cat metadata.json
          printf 'END_CHROMIUM_ARCHIVE_DIGEST_%s\n' "$ARCH"
        env:
          ARCH: ${{ matrix.arch }}
