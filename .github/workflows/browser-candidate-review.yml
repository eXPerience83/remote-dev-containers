name: Browser candidate review (read-only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/browser-candidate-review.yml

permissions:
  contents: read

jobs:
  discover:
    name: Review Playwright browser (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover candidate strictly as data
        env:
          REVIEW_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/playwright-upstream.py discover \
            --arch "$REVIEW_ARCH" --output "$RUNNER_TEMP/browser-candidate.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          obj = json.loads((Path(os.environ['RUNNER_TEMP']) / 'browser-candidate.json').read_text())
          result = {'arch': obj['arch'], 'status': obj['status']}
          if obj['status'] == 'candidate':
              result['version'] = obj['version']
              result['playwright_core_version'] = obj['playwright_core_version']
              result['package_sri'] = {k: v['integrity'] for k, v in obj['lock']['packages'].items() if k.startswith('node_modules/')}
              result['archives'] = obj['archives']
          else:
              result['reason'] = obj.get('reason', '')
          print('BROWSER_CANDIDATE_JSON=' + json.dumps(result, separators=(',', ':')))
          PY
