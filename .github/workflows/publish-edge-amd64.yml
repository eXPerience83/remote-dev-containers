name: Publish edge AMD64

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "versions.env"
      - "images/**"
      - "scripts/**"
      - "config/**"
      - "third_party/**"
      - ".github/workflows/publish-edge-amd64.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-edge-amd64
  cancel-in-progress: false

jobs:
  publish-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: edge images may only be published from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate repository configuration
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash scripts/validate-version-pins.sh
          bash scripts/test-source-revision.sh
          jq -e . renovate.json >/dev/null
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve image metadata
        id: metadata
        run: |
          source versions.env
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "ubuntu_version=$UBUNTU_VERSION" >> "$GITHUB_OUTPUT"
          echo "ubuntu_digest=$UBUNTU_DIGEST" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "codex_tag=$CODEX_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "codex_amd64_sha256=$CODEX_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "codex_arm64_sha256=$CODEX_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_version=$GH_VERSION" >> "$GITHUB_OUTPUT"
          echo "gh_amd64_sha256=$GH_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_arm64_sha256=$GH_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_version=$TTYD_VERSION" >> "$GITHUB_OUTPUT"
          echo "ttyd_amd64_sha256=$TTYD_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_arm64_sha256=$TTYD_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_version=$MISE_VERSION" >> "$GITHUB_OUTPUT"
          echo "mise_amd64_sha256=$MISE_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_arm64_sha256=$MISE_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "uv_version=$UV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and publish edge base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            UBUNTU_VERSION=${{ steps.metadata.outputs.ubuntu_version }}
            UBUNTU_DIGEST=${{ steps.metadata.outputs.ubuntu_digest }}
            BASE_VERSION=${{ steps.metadata.outputs.base_version }}
            GH_VERSION=${{ steps.metadata.outputs.gh_version }}
            GH_AMD64_SHA256=${{ steps.metadata.outputs.gh_amd64_sha256 }}
            GH_ARM64_SHA256=${{ steps.metadata.outputs.gh_arm64_sha256 }}
            TTYD_VERSION=${{ steps.metadata.outputs.ttyd_version }}
            TTYD_AMD64_SHA256=${{ steps.metadata.outputs.ttyd_amd64_sha256 }}
            TTYD_ARM64_SHA256=${{ steps.metadata.outputs.ttyd_arm64_sha256 }}
            MISE_VERSION=${{ steps.metadata.outputs.mise_version }}
            MISE_AMD64_SHA256=${{ steps.metadata.outputs.mise_amd64_sha256 }}
            MISE_ARM64_SHA256=${{ steps.metadata.outputs.mise_arm64_sha256 }}
            PYTHON_VERSION=${{ steps.metadata.outputs.python_version }}
            NODE_VERSION=${{ steps.metadata.outputs.node_version }}
            UV_VERSION=${{ steps.metadata.outputs.uv_version }}
          tags: |
            ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base:edge-amd64
            ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge
          provenance: mode=max
          sbom: true

      - name: Build and publish edge Codex image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/codex/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base:sha-${{ github.sha }}
            CODEX_RELEASE_TAG=${{ steps.metadata.outputs.codex_tag }}
            CODEX_AMD64_SHA256=${{ steps.metadata.outputs.codex_amd64_sha256 }}
            CODEX_ARM64_SHA256=${{ steps.metadata.outputs.codex_arm64_sha256 }}
            PROJECT_VERSION=edge
            SOURCE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev:edge
            ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev:edge-amd64
            ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge
          provenance: mode=max
          sbom: true
