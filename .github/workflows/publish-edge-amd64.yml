name: Publish edge AMD64

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "versions.env"
      - "images/**"
      - "scripts/**"
      - "config/**"
      - "third_party/**"
      - ".github/workflows/publish-edge-amd64.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-edge-amd64
  cancel-in-progress: false

jobs:
  publish-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: edge images may only be published from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate repository configuration
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash scripts/validate-version-pins.sh
          bash scripts/test-source-revision.sh
          jq -e . renovate.json >/dev/null
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve image metadata
        id: metadata
        run: |
          source versions.env
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "ubuntu_version=$UBUNTU_VERSION" >> "$GITHUB_OUTPUT"
          echo "ubuntu_digest=$UBUNTU_DIGEST" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "codex_tag=$CODEX_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "codex_amd64_sha256=$CODEX_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "codex_arm64_sha256=$CODEX_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_version=$GH_VERSION" >> "$GITHUB_OUTPUT"
          echo "gh_amd64_sha256=$GH_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_arm64_sha256=$GH_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_version=$TTYD_VERSION" >> "$GITHUB_OUTPUT"
          echo "ttyd_amd64_sha256=$TTYD_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_arm64_sha256=$TTYD_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_version=$MISE_VERSION" >> "$GITHUB_OUTPUT"
          echo "mise_amd64_sha256=$MISE_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_arm64_sha256=$MISE_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "uv_version=$UV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build untagged edge base candidate
        id: base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            UBUNTU_VERSION=${{ steps.metadata.outputs.ubuntu_version }}
            UBUNTU_DIGEST=${{ steps.metadata.outputs.ubuntu_digest }}
            BASE_VERSION=${{ steps.metadata.outputs.base_version }}
            GH_VERSION=${{ steps.metadata.outputs.gh_version }}
            GH_AMD64_SHA256=${{ steps.metadata.outputs.gh_amd64_sha256 }}
            GH_ARM64_SHA256=${{ steps.metadata.outputs.gh_arm64_sha256 }}
            TTYD_VERSION=${{ steps.metadata.outputs.ttyd_version }}
            TTYD_AMD64_SHA256=${{ steps.metadata.outputs.ttyd_amd64_sha256 }}
            TTYD_ARM64_SHA256=${{ steps.metadata.outputs.ttyd_arm64_sha256 }}
            MISE_VERSION=${{ steps.metadata.outputs.mise_version }}
            MISE_AMD64_SHA256=${{ steps.metadata.outputs.mise_amd64_sha256 }}
            MISE_ARM64_SHA256=${{ steps.metadata.outputs.mise_arm64_sha256 }}
            PYTHON_VERSION=${{ steps.metadata.outputs.python_version }}
            NODE_VERSION=${{ steps.metadata.outputs.node_version }}
            NPM_VERSION=${{ steps.metadata.outputs.npm_version }}
            UV_VERSION=${{ steps.metadata.outputs.uv_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge
          provenance: mode=max
          sbom: true

      - name: Scan exact edge base candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base@${{ steps.base.outputs.digest }}
          format: json
          output: trivy-publish-base.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Build untagged edge Codex candidate
        id: codex
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/codex/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base@${{ steps.base.outputs.digest }}
            CODEX_RELEASE_TAG=${{ steps.metadata.outputs.codex_tag }}
            CODEX_AMD64_SHA256=${{ steps.metadata.outputs.codex_amd64_sha256 }}
            CODEX_ARM64_SHA256=${{ steps.metadata.outputs.codex_arm64_sha256 }}
            PROJECT_VERSION=edge
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=edge
          provenance: mode=max
          sbom: true

      - name: Scan exact edge Codex candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev@${{ steps.codex.outputs.digest }}
          format: json
          output: trivy-publish-codex.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload publication vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-publication-reports
          path: |
            trivy-publish-base.json
            trivy-publish-codex.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce no fixable critical vulnerabilities
        run: |
          set -euo pipefail
          findings=0

          for entry in \
            "base:trivy-publish-base.json" \
            "codex:trivy-publish-codex.json"; do
            label="${entry%%:*}"
            report="${entry#*:}"
            count="$(jq '[
              .Results[]?
              | .Vulnerabilities[]?
              | select(.Severity == "CRITICAL")
              | select((.FixedVersion // "") != "")
            ] | length' "$report")"

            if (( count > 0 )); then
              echo "ERROR: fixable CRITICAL vulnerabilities in exact $label publication candidate:" >&2
              jq -r '
                .Results[]? as $result
                | $result.Vulnerabilities[]?
                | select(.Severity == "CRITICAL")
                | select((.FixedVersion // "") != "")
                | "- \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) -> \(.FixedVersion) | \($result.Target)"
              ' "$report" >&2
            else
              echo "No fixable CRITICAL vulnerabilities in exact $label publication candidate."
            fi

            findings=$((findings + count))
          done

          if (( findings > 0 )); then
            echo "ERROR: publication vulnerability gate found $findings fixable CRITICAL finding(s)" >&2
            exit 1
          fi

      - name: Promote scanned digests to public edge tags
        run: |
          set -euo pipefail
          base_digest="${{ steps.base.outputs.digest }}"
          codex_digest="${{ steps.codex.outputs.digest }}"
          base_ref="ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base@${base_digest}"
          codex_ref="ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev@${codex_digest}"

          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file base-promotion.json \
            --tag "ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base:edge-amd64" \
            --tag "ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base:sha-${GITHUB_SHA}" \
            "$base_ref"

          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file codex-promotion.json \
            --tag "ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev:edge" \
            --tag "ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev:edge-amd64" \
            --tag "ghcr.io/${{ steps.metadata.outputs.namespace }}/codex-remote-dev:sha-${GITHUB_SHA}" \
            "$codex_ref"

          promoted_base="$(jq -r '.["containerimage.descriptor"].digest // .["containerimage.digest"] // empty' base-promotion.json)"
          promoted_codex="$(jq -r '.["containerimage.descriptor"].digest // .["containerimage.digest"] // empty' codex-promotion.json)"

          if [[ "$promoted_base" != "$base_digest" ]]; then
            echo "ERROR: promoted base digest $promoted_base differs from scanned digest $base_digest" >&2
            exit 1
          fi
          if [[ "$promoted_codex" != "$codex_digest" ]]; then
            echo "ERROR: promoted Codex digest $promoted_codex differs from scanned digest $codex_digest" >&2
            exit 1
          fi
