name: Publish edge AMD64

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - "versions.env"
      - "mise.toml"
      - "mise.lock"
      - "images/**"
      - "scripts/**"
      - "config/**"
      - "third_party/**"
      - ".github/workflows/publish-edge-amd64.yml"
  schedule:
    - cron: "11 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-edge-amd64
  cancel-in-progress: false

jobs:
  publish-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ERROR: edge images may only be published from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate repository configuration
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          REMOTE_DEV_IMAGE_NAMES_LIB=./scripts/lib/remote-dev-image-names.sh \
            bash scripts/test-image-name-compat.sh
          bash scripts/test-image-identity.sh
          python3 scripts/test_edge_build_identity.py
          python3 scripts/test_update_upstream_changelog.py
          bash scripts/validate-version-pins.sh
          bash scripts/test-source-revision.sh
          jq -e . renovate.json >/dev/null
          python3 scripts/validate-renovate-ownership.py --root .
          for file in compose/*.yml; do
            docker compose -f "$file" config --quiet
            echo "OK $file"
          done

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Resolve image metadata
        id: metadata
        run: |
          source versions.env
          build_date="$(date -u +%F)"
          project_version="$(python3 scripts/format-edge-build-identity.py \
            --date "$build_date" \
            --source-revision "$GITHUB_SHA")"
          echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "project_version=$project_version" >> "$GITHUB_OUTPUT"
          echo "ubuntu_version=$UBUNTU_VERSION" >> "$GITHUB_OUTPUT"
          echo "ubuntu_digest=$UBUNTU_DIGEST" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "codex_tag=$CODEX_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "codex_amd64_sha256=$CODEX_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "codex_arm64_sha256=$CODEX_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_version=$GH_VERSION" >> "$GITHUB_OUTPUT"
          echo "gh_amd64_sha256=$GH_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "gh_arm64_sha256=$GH_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_version=$TTYD_VERSION" >> "$GITHUB_OUTPUT"
          echo "ttyd_amd64_sha256=$TTYD_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "ttyd_arm64_sha256=$TTYD_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_version=$MISE_VERSION" >> "$GITHUB_OUTPUT"
          echo "mise_amd64_sha256=$MISE_AMD64_SHA256" >> "$GITHUB_OUTPUT"
          echo "mise_arm64_sha256=$MISE_ARM64_SHA256" >> "$GITHUB_OUTPUT"
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "uv_version=$UV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build untagged edge base candidate
        id: base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev-base,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            UBUNTU_VERSION=${{ steps.metadata.outputs.ubuntu_version }}
            UBUNTU_DIGEST=${{ steps.metadata.outputs.ubuntu_digest }}
            BASE_VERSION=${{ steps.metadata.outputs.base_version }}
            GH_VERSION=${{ steps.metadata.outputs.gh_version }}
            GH_AMD64_SHA256=${{ steps.metadata.outputs.gh_amd64_sha256 }}
            GH_ARM64_SHA256=${{ steps.metadata.outputs.gh_arm64_sha256 }}
            TTYD_VERSION=${{ steps.metadata.outputs.ttyd_version }}
            TTYD_AMD64_SHA256=${{ steps.metadata.outputs.ttyd_amd64_sha256 }}
            TTYD_ARM64_SHA256=${{ steps.metadata.outputs.ttyd_arm64_sha256 }}
            MISE_VERSION=${{ steps.metadata.outputs.mise_version }}
            MISE_AMD64_SHA256=${{ steps.metadata.outputs.mise_amd64_sha256 }}
            MISE_ARM64_SHA256=${{ steps.metadata.outputs.mise_arm64_sha256 }}
            PYTHON_VERSION=${{ steps.metadata.outputs.python_version }}
            NODE_VERSION=${{ steps.metadata.outputs.node_version }}
            NPM_VERSION=${{ steps.metadata.outputs.npm_version }}
            UV_VERSION=${{ steps.metadata.outputs.uv_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.project_version }}
            io.github.experience83.remote-dev.channel=edge
          provenance: mode=max
          sbom: true

      - name: Resolve exact edge base AMD64 manifest
        id: base_manifest
        env:
          NAMESPACE: ${{ steps.metadata.outputs.namespace }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$(bash scripts/resolve-oci-platform-manifest.sh \
            "ghcr.io/${NAMESPACE}/remote-dev-base@${BASE_DIGEST}" linux amd64)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Build untagged edge Remote Dev candidate
        id: runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/codex/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ steps.metadata.outputs.namespace }}/remote-dev,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ steps.base_manifest.outputs.ref }}
            CODEX_RELEASE_TAG=${{ steps.metadata.outputs.codex_tag }}
            CODEX_AMD64_SHA256=${{ steps.metadata.outputs.codex_amd64_sha256 }}
            CODEX_ARM64_SHA256=${{ steps.metadata.outputs.codex_arm64_sha256 }}
            PROJECT_VERSION=${{ steps.metadata.outputs.project_version }}
            PROJECT_CHANNEL=edge
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.project_version }}
            io.github.experience83.remote-dev.channel=edge
          provenance: mode=max
          sbom: true

      - name: Resolve exact edge Remote Dev AMD64 manifest
        id: runtime_manifest
        env:
          NAMESPACE: ${{ steps.metadata.outputs.namespace }}
          REMOTE_DEV_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$(bash scripts/resolve-oci-platform-manifest.sh \
            "ghcr.io/${NAMESPACE}/remote-dev@${REMOTE_DEV_DIGEST}" linux amd64)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact publication candidates
        env:
          NAMESPACE: ${{ steps.metadata.outputs.namespace }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          BASE_MANIFEST_REF: ${{ steps.base_manifest.outputs.ref }}
          REMOTE_DEV_DIGEST: ${{ steps.runtime.outputs.digest }}
          REMOTE_DEV_MANIFEST_REF: ${{ steps.runtime_manifest.outputs.ref }}
          PROJECT_VERSION: ${{ steps.metadata.outputs.project_version }}
        run: |
          set -euo pipefail
          bash scripts/validate-edge-publication-candidate.sh \
            "ghcr.io/${NAMESPACE}/remote-dev-base@${BASE_DIGEST}" \
            "$BASE_MANIFEST_REF" \
            "ghcr.io/${NAMESPACE}/remote-dev@${REMOTE_DEV_DIGEST}" \
            "$REMOTE_DEV_MANIFEST_REF" \
            "$GITHUB_SHA" \
            "$PROJECT_VERSION"

      - name: Generate exact edge base SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.base_manifest.outputs.ref }}
          format: spdx-json
          output: sbom-publish-base.spdx.json

      - name: Generate exact edge Remote Dev SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime_manifest.outputs.ref }}
          format: spdx-json
          output: sbom-publish-remote-dev.spdx.json
          skip-setup-trivy: true

      - name: Scan exact edge base candidate for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.base_manifest.outputs.ref }}
          format: json
          output: trivy-publish-base.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"
          skip-setup-trivy: true

      - name: Scan exact edge Remote Dev candidate for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime_manifest.outputs.ref }}
          format: json
          output: trivy-publish-remote-dev.json
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload exact publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edge-publication-reports
          path: |
            sbom-publish-base.spdx.json
            sbom-publish-remote-dev.spdx.json
            trivy-publish-base.json
            trivy-publish-remote-dev.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce no fixable critical vulnerabilities
        run: |
          bash scripts/enforce-trivy-gate.sh \
            "exact edge base publication candidate:trivy-publish-base.json" \
            "exact edge Remote Dev publication candidate:trivy-publish-remote-dev.json"

      - name: Promote one scanned and smoke-tested digest to canonical edge tags
        env:
          NAMESPACE: ${{ steps.metadata.outputs.namespace }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          REMOTE_DEV_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          base_ref="ghcr.io/${NAMESPACE}/remote-dev-base@${BASE_DIGEST}"
          runtime_ref="ghcr.io/${NAMESPACE}/remote-dev@${REMOTE_DEV_DIGEST}"

          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file base-promotion.json \
            --tag "ghcr.io/${NAMESPACE}/remote-dev-base:edge-amd64" \
            --tag "ghcr.io/${NAMESPACE}/remote-dev-base:sha-${GITHUB_SHA}" \
            "$base_ref"

          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file runtime-promotion.json \
            --tag "ghcr.io/${NAMESPACE}/remote-dev:edge" \
            --tag "ghcr.io/${NAMESPACE}/remote-dev:edge-amd64" \
            --tag "ghcr.io/${NAMESPACE}/remote-dev:sha-${GITHUB_SHA}" \
            "$runtime_ref"

          promoted_base="$(jq -r '.["containerimage.descriptor"].digest // .["containerimage.digest"] // empty' base-promotion.json)"
          promoted_runtime="$(jq -r '.["containerimage.descriptor"].digest // .["containerimage.digest"] // empty' runtime-promotion.json)"

          if [[ "$promoted_base" != "$BASE_DIGEST" ]]; then
            echo "ERROR: promoted base digest $promoted_base differs from validated digest $BASE_DIGEST" >&2
            exit 1
          fi
          if [[ "$promoted_runtime" != "$REMOTE_DEV_DIGEST" ]]; then
            echo "ERROR: promoted Remote Dev digest $promoted_runtime differs from validated digest $REMOTE_DEV_DIGEST" >&2
            exit 1
          fi

          base_tag_ref="ghcr.io/${NAMESPACE}/remote-dev-base:edge-amd64"
          actual_base_digest="$(
            docker buildx imagetools inspect "$base_tag_ref" \
              --format '{{json .Manifest.Digest}}' | tr -d '"'
          )"
          if [[ "$actual_base_digest" != "$BASE_DIGEST" ]]; then
            echo "ERROR: $base_tag_ref resolved to $actual_base_digest instead of $BASE_DIGEST" >&2
            exit 1
          fi

          for tag in edge edge-amd64 "sha-${GITHUB_SHA}"; do
            tag_ref="ghcr.io/${NAMESPACE}/remote-dev:${tag}"
            actual_digest="$(
              docker buildx imagetools inspect "$tag_ref" \
                --format '{{json .Manifest.Digest}}' | tr -d '"'
            )"
            if [[ "$actual_digest" != "$REMOTE_DEV_DIGEST" ]]; then
              echo "ERROR: $tag_ref resolved to $actual_digest instead of $REMOTE_DEV_DIGEST" >&2
              exit 1
            fi
          done
