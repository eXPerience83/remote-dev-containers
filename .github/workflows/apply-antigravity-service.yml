name: Apply isolated Antigravity service

on:
  push:
    branches:
      - feat/antigravity-isolated-service
    paths:
      - .github/workflows/apply-antigravity-service.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/antigravity-isolated-service
          fetch-depth: 0

      - name: Apply isolated service and validation changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def write(path: str, content: str) -> None:
              (ROOT / path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement anchor in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"missing start anchor in {path}: {start!r}")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"missing end anchor in {path}: {end!r}")
              target.write_text(
                  text[:start_index] + replacement + text[end_index:],
                  encoding="utf-8",
              )

