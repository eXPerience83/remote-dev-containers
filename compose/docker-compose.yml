x-remote-dev-image: &remote-dev-image ${REMOTE_DEV_IMAGE:-${CODEX_IMAGE:-ghcr.io/experience83/remote-dev:edge-amd64}}

services:
  launcher:
    image: *remote-dev-image
    container_name: remote-dev-launcher
    restart: unless-stopped
    user: "0:0"

    environment:
      TZ: ${TZ:-Europe/Madrid}
      REMOTE_DEV_ROLE: launcher
      REMOTE_DEV_START_MODE: menu

      WEB_BIND: 0.0.0.0
      WEB_PORT: "7680"
      WEB_BASE_PATH: ${LAUNCHER_BASE_PATH:-/}
      WEB_CHECK_ORIGIN: ${LAUNCHER_CHECK_ORIGIN:-1}
      ALLOW_INSECURE_WEB: "1"

      REMOTE_DEV_LAUNCHER_CODEX_HOST: ${REMOTE_DEV_CODEX_PUBLIC_HOST:-}
      REMOTE_DEV_LAUNCHER_CODEX_PORT: ${WEB_PUBLISH_PORT:-7681}
      REMOTE_DEV_LAUNCHER_CODEX_SCHEME: ${REMOTE_DEV_CODEX_PUBLIC_SCHEME:-}
      REMOTE_DEV_LAUNCHER_CODEX_PATH: ${WEB_BASE_PATH:-/}

      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_ENABLED: ${REMOTE_DEV_ENABLE_ANTIGRAVITY_SERVICE:-0}
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_HOST: ${REMOTE_DEV_ANTIGRAVITY_PUBLIC_HOST:-}
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_PORT: ${ANTIGRAVITY_WEB_PUBLISH_PORT:-7682}
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_SCHEME: ${REMOTE_DEV_ANTIGRAVITY_PUBLIC_SCHEME:-}
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_PATH: ${ANTIGRAVITY_WEB_BASE_PATH:-/}

    security_opt:
      - no-new-privileges:true

    ports:
      - "${LAUNCHER_PUBLISH_IP:-${WEB_PUBLISH_IP:-127.0.0.1}}:${LAUNCHER_PUBLISH_PORT:-7680}:7680"

    tmpfs:
      - /tmp:size=64m,mode=1777

    stop_grace_period: 10s

  codex:
    image: *remote-dev-image
    container_name: codex-remote-dev
    restart: unless-stopped
    user: "0:0"

    environment:
      TZ: ${TZ:-Europe/Madrid}
      REMOTE_DEV_ROLE: codex
      WORKSPACE: /workspace
      CODEX_HOME: /root/.codex
      GH_CONFIG_DIR: /root/.config/gh
      GIT_CONFIG_GLOBAL: /root/.config/git/config

      WEB_BIND: 0.0.0.0
      WEB_PORT: "7681"
      WEB_BASE_PATH: ${WEB_BASE_PATH:-/}
      WEB_USERNAME: ${WEB_USERNAME:-codex}
      WEB_PASSWORD_FILE: /run/secrets/web_password
      WEB_MAX_CLIENTS: ${WEB_MAX_CLIENTS:-1}
      WEB_CHECK_ORIGIN: ${WEB_CHECK_ORIGIN:-1}
      ALLOW_INSECURE_WEB: ${ALLOW_INSECURE_WEB:-0}
      START_MODE: ${START_MODE:-menu}
      TMUX_SESSION: ${TMUX_SESSION:-codex}
      REMOTE_DEV_CODEX_APPROVAL_MODE: ${REMOTE_DEV_CODEX_APPROVAL_MODE:-autonomous}

      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      GH_HOST: ${GH_HOST:-github.com}
      GH_PAGER: cat
      GH_NO_UPDATE_NOTIFIER: "1"
      GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
      DO_NOT_TRACK: "1"

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_CA_CERTIFICATE: ${CODEX_CA_CERTIFICATE:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

    security_opt:
      - no-new-privileges:true

    ports:
      - "${WEB_PUBLISH_IP:-127.0.0.1}:${WEB_PUBLISH_PORT:-7681}:7681"

    # Run scripts/preflight-data-layout.py before deployment. The explicit
    # create_host_path setting is defense-in-depth for Compose implementations.
    volumes:
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/workspaces/codex
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/codex/agent
        target: /root/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/codex/gh
        target: /root/.config/gh
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/codex/git
        target: /root/.config/git
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/codex/ssh
        target: /root/.ssh
        bind:
          create_host_path: false

    secrets:
      - web_password

    tmpfs:
      - /tmp:size=512m,mode=1777

    shm_size: 256m
    stop_grace_period: 30s

  antigravity:
    profiles: ["antigravity"]
    image: *remote-dev-image
    container_name: antigravity-remote-dev
    restart: unless-stopped
    user: "0:0"

    environment:
      TZ: ${TZ:-Europe/Madrid}
      REMOTE_DEV_ROLE: antigravity
      REMOTE_DEV_ENABLE_EXPERIMENTAL_ANTIGRAVITY: "1"
      WORKSPACE: /workspace
      GH_CONFIG_DIR: /root/.config/gh
      GIT_CONFIG_GLOBAL: /root/.config/git/config

      WEB_BIND: 0.0.0.0
      WEB_PORT: "7682"
      WEB_BASE_PATH: ${ANTIGRAVITY_WEB_BASE_PATH:-/}
      WEB_USERNAME: ${ANTIGRAVITY_WEB_USERNAME:-antigravity}
      WEB_PASSWORD_FILE: /run/secrets/web_password
      WEB_MAX_CLIENTS: ${ANTIGRAVITY_WEB_MAX_CLIENTS:-1}
      WEB_CHECK_ORIGIN: ${ANTIGRAVITY_WEB_CHECK_ORIGIN:-1}
      ALLOW_INSECURE_WEB: ${ANTIGRAVITY_ALLOW_INSECURE_WEB:-0}
      START_MODE: ${ANTIGRAVITY_START_MODE:-menu}
      TMUX_SESSION: ${ANTIGRAVITY_TMUX_SESSION:-antigravity}
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"

      GIT_USER_NAME: ${ANTIGRAVITY_GIT_USER_NAME:-${GIT_USER_NAME:-}}
      GIT_USER_EMAIL: ${ANTIGRAVITY_GIT_USER_EMAIL:-${GIT_USER_EMAIL:-}}
      GH_HOST: ${GH_HOST:-github.com}
      GH_PAGER: cat
      GH_NO_UPDATE_NOTIFIER: "1"
      GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"

      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

    security_opt:
      - no-new-privileges:true

    ports:
      - "${ANTIGRAVITY_WEB_PUBLISH_IP:-127.0.0.1}:${ANTIGRAVITY_WEB_PUBLISH_PORT:-7682}:7682"

    volumes:
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/workspaces/antigravity
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/antigravity/bin
        target: /root/.local/bin
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/antigravity/runtime
        target: /root/.local/share/remote-dev/antigravity
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/antigravity/vendor
        target: /root/.gemini/antigravity-cli
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/antigravity/gh
        target: /root/.config/gh
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/antigravity/git
        target: /root/.config/git
        bind:
          create_host_path: false
      - type: bind
        source: ${REMOTE_DEV_DATA_ROOT:-../data}/state/antigravity/ssh
        target: /root/.ssh
        bind:
          create_host_path: false

    secrets:
      - source: antigravity_web_password
        target: web_password

    tmpfs:
      - /tmp:size=512m,mode=1777

    shm_size: 256m
    stop_grace_period: 30s

secrets:
  web_password:
    file: ${REMOTE_DEV_DATA_ROOT:-../data}/secrets/codex/web_password.txt
  antigravity_web_password:
    file: ${REMOTE_DEV_DATA_ROOT:-../data}/secrets/antigravity/web_password.txt
