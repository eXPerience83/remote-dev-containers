x-remote-dev-image: &remote-dev-image ${REMOTE_DEV_IMAGE:-${CODEX_IMAGE:-ghcr.io/experience83/remote-dev:edge-amd64}}

services:
  launcher:
    image: *remote-dev-image
    container_name: remote-dev-launcher
    restart: unless-stopped
    user: "0:0"
    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    pids_limit: 64

    environment:
      TZ: Europe/Madrid
      REMOTE_DEV_ROLE: launcher
      REMOTE_DEV_START_MODE: menu

      WEB_BIND: 0.0.0.0
      WEB_PORT: "7680"
      WEB_BASE_PATH: /
      WEB_CHECK_ORIGIN: "1"
      ALLOW_INSECURE_WEB: "1"

      # Leave host/scheme empty to reuse the browser hostname and scheme.
      REMOTE_DEV_LAUNCHER_CODEX_HOST: ""
      REMOTE_DEV_LAUNCHER_CODEX_PORT: "7681"
      REMOTE_DEV_LAUNCHER_CODEX_SCHEME: ""
      REMOTE_DEV_LAUNCHER_CODEX_PATH: /

      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_ENABLED: "1"
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_HOST: ""
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_PORT: "7682"
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_SCHEME: ""
      REMOTE_DEV_LAUNCHER_ANTIGRAVITY_PATH: /

    security_opt:
      - no-new-privileges:true

    ports:
      # Replace with the LAN or Tailscale IP of TrueNAS.
      - "192.168.1.10:7680:7680"

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=16m,mode=755

    stop_grace_period: 10s

  codex:
    image: *remote-dev-image
    container_name: codex-remote-dev
    restart: unless-stopped
    user: "0:0"
    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    pids_limit: 1024

    environment:
      TZ: Europe/Madrid
      REMOTE_DEV_ROLE: codex
      WORKSPACE: /workspace
      # Optional validated child name for START_MODE=codex/agent; leave empty in menu mode.
      REMOTE_DEV_PROJECT: ''
      CODEX_HOME: /root/.codex
      REMOTE_DEV_CODEX_RUNTIME_ROOT: /root/.local/share/remote-dev/codex-runtime
      GH_CONFIG_DIR: /root/.config/gh
      GIT_CONFIG_GLOBAL: /root/.config/git/config

      WEB_BIND: 0.0.0.0
      WEB_PORT: "7681"
      WEB_BASE_PATH: /
      WEB_USERNAME: codex
      # Home-mode convenience. TrueNAS administrators can read this value from
      # the App YAML or docker inspect. Replace the empty value before saving.
      # Use the file-backed mode instead for a shared or hardened deployment.
      WEB_PASSWORD: ''
      WEB_MAX_CLIENTS: "1"
      WEB_CHECK_ORIGIN: "1"
      ALLOW_INSECURE_WEB: "0"
      START_MODE: menu
      TMUX_SESSION: codex
      REMOTE_DEV_CODEX_APPROVAL_MODE: autonomous

      GH_HOST: github.com
      GH_PAGER: cat
      GH_NO_UPDATE_NOTIFIER: "1"
      GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
      DO_NOT_TRACK: "1"
      NPM_CONFIG_CACHE: /tmp/remote-dev-npm-cache
      UV_CACHE_DIR: /tmp/remote-dev-uv-cache

      OPENAI_API_KEY: ""
      GIT_USER_NAME: ""
      GIT_USER_EMAIL: ""

    security_opt:
      - no-new-privileges:true

    ports:
      - "192.168.1.10:7681:7681"

    # Before saving this YAML, run scripts/preflight-data-layout.py on the
    # TrueNAS host with --root /mnt/Pool1/remote-dev --include-antigravity
    # --password-source environment. create_host_path is only defense-in-depth
    # because not every Compose release enforces it reliably.
    volumes:
      - type: bind
        source: /mnt/Pool1/remote-dev/workspaces/codex
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/codex/agent
        target: /root/.codex
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/codex/runtime
        target: /root/.local/share/remote-dev/codex-runtime
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/codex/gh
        target: /root/.config/gh
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/codex/git
        target: /root/.config/git
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/codex/ssh
        target: /root/.ssh
        bind:
          create_host_path: false

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /run:rw,exec,nosuid,nodev,size=1536m,mode=755

    shm_size: 256m
    stop_grace_period: 30s

  antigravity:
    image: *remote-dev-image
    container_name: antigravity-remote-dev
    restart: unless-stopped
    user: "0:0"
    read_only: true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    pids_limit: 1024

    environment:
      TZ: Europe/Madrid
      REMOTE_DEV_ROLE: antigravity
      REMOTE_DEV_ENABLE_EXPERIMENTAL_ANTIGRAVITY: "1"
      WORKSPACE: /workspace
      # Optional validated child name for START_MODE=agent; leave empty in menu mode.
      REMOTE_DEV_PROJECT: ''
      GH_CONFIG_DIR: /root/.config/gh
      GIT_CONFIG_GLOBAL: /root/.config/git/config

      WEB_BIND: 0.0.0.0
      WEB_PORT: "7682"
      WEB_BASE_PATH: /
      WEB_USERNAME: antigravity
      # Replace the empty value before saving and keep it independent from the
      # Codex terminal password.
      WEB_PASSWORD: ''
      WEB_MAX_CLIENTS: "1"
      WEB_CHECK_ORIGIN: "1"
      ALLOW_INSECURE_WEB: "0"
      START_MODE: menu
      TMUX_SESSION: antigravity
      AGY_CLI_DISABLE_AUTO_UPDATE: "true"

      GH_HOST: github.com
      GH_PAGER: cat
      GH_NO_UPDATE_NOTIFIER: "1"
      GH_NO_EXTENSION_UPDATE_NOTIFIER: "1"
      DO_NOT_TRACK: "1"
      NPM_CONFIG_CACHE: /tmp/remote-dev-npm-cache
      UV_CACHE_DIR: /tmp/remote-dev-uv-cache
      GIT_USER_NAME: ""
      GIT_USER_EMAIL: ""

    security_opt:
      - no-new-privileges:true

    ports:
      - "192.168.1.10:7682:7682"

    volumes:
      - type: bind
        source: /mnt/Pool1/remote-dev/workspaces/antigravity
        target: /workspace
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/antigravity/bin
        target: /root/.local/bin
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/antigravity/runtime
        target: /root/.local/share/remote-dev/antigravity
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/antigravity/vendor
        target: /root/.gemini/antigravity-cli
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/antigravity/gh
        target: /root/.config/gh
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/antigravity/git
        target: /root/.config/git
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/Pool1/remote-dev/state/antigravity/ssh
        target: /root/.ssh
        bind:
          create_host_path: false

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=64m,mode=755

    shm_size: 256m
    stop_grace_period: 30s

x-portals:
  - host: truenas
    name: "Remote Dev Launcher"
    path: /
    port: 7680
    scheme: http
