# Make browser-hosted tmux sessions usable with a mouse wheel without
# sending raw arrow-key escape sequences into menus or shell prompts.
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10

# ttyd exposes xterm-256color and xterm.js supports OSC 8 hyperlinks. Declare
# that capability explicitly so tmux preserves compact OAuth links in panes and
# popups instead of reducing them to plain text.
set -as terminal-features ',xterm-256color:hyperlinks'

# Keep the status line stable while foreground programs and copy mode change.
set -g automatic-rename off
set -g allow-rename off
